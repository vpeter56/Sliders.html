    ["Esc", "Close any sheet"],
  ];
  const sliderRows = [
    ["Drag", "Adjust hours"],
    ["Click track", "Snap to position"],
    ["Wheel", "Fine-tune (Shift = ×4)"],
    ["← →", "Step by snap"],
    ["Shift +←/→", "Big step"],
    ["Home / End", "0 / max"],
  ];
  return (
    <div className="modal-overlay" onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
      <div className="modal-sheet" style={{padding:"24px 24px 28px"}}>
        <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:18}}>
          <h2 style={{fontSize:20, fontWeight:600, letterSpacing:"-0.02em"}}>Shortcuts</h2>
          <button onClick={onClose} className="btn btn-ghost btn-icon" aria-label="Close">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
        <div className="label" style={{marginBottom:10}}>Anywhere</div>
        <div style={{display:"flex", flexDirection:"column", gap:6, marginBottom:18}}>
          {rows.map(([k,v],i)=>(
            <div key={i} style={{display:"flex", alignItems:"center", justifyContent:"space-between", padding:"8px 12px", background:"var(--bg-input)", borderRadius:10}}>
              <span className="kbd" style={{minWidth:48, textAlign:"center"}}>{k}</span>
              <span style={{fontSize:13, color:"var(--text-2)"}}>{v}</span>
            </div>
          ))}
        </div>
        <div className="label" style={{marginBottom:10}}>On any slider (hover or focus)</div>
        <div style={{display:"flex", flexDirection:"column", gap:6}}>
          {sliderRows.map(([k,v],i)=>(
            <div key={i} style={{display:"flex", alignItems:"center", justifyContent:"space-between", padding:"8px 12px", background:"var(--bg-input)", borderRadius:10}}>
              <span className="kbd" style={{minWidth:96, textAlign:"center"}}>{k}</span>
              <span style={{fontSize:13, color:"var(--text-2)"}}>{v}</span>
            </div>
          ))}
        </div>
        <div style={{height:"env(safe-area-inset-bottom,0px)"}}/>
      </div>
    </div>
  );
}

/* ─────────── App ─────────── */
function App() {
  const [state, dispatch] = useReducer(reducer, null, initState);
  const [newName, setNewName] = useState("");
  const [editTask, setEditTask] = useState(null);
  const [toast, setToast] = useState(null);
  const [showSettings, setShowSettings] = useState(false);
  const [showFavs, setShowFavs] = useState(false);
  const [showSync, setShowSync] = useState(false);
  const [showHelp, setShowHelp] = useState(false);
  const [activeView, setActiveView] = useState("today");
  const [activeDate, setActiveDate] = useState(todayStr);
  const [selectedTaskId, setSelectedTaskId] = useState(null);
  const [longDragIdx, setLongDragIdx] = useState(null);
  const [dragOver, setDragOver] = useState(null);
  const [dragPos, setDragPos] = useState({x:0,y:0});
  const [inputFocused, setInputFocused] = useState(false);
  const [confirmRm, setConfirmRm] = useState(null);
  const [nowH, setNowH] = useState(() => { const d=new Date(); return d.getHours() + d.getMinutes()/60 + d.getSeconds()/3600; });
  const activeDateRef = useRef(activeDate);
  const lpTimer = useRef(null), confirmTimer = useRef(null);
  const taskListRef = useRef(), fileRef = useRef(), inputRef = useRef();

  const { tasks, favs, step, dark, showTL, dayStart, dayEnd } = state;
  const dl = calcDayLen(dayStart, dayEnd);
  const total = tasks.reduce((s,t)=>s+t.hours,0);
  const remaining = dl - total;
  const over = remaining < -TOL, perfect = Math.abs(remaining) < TOL;

  useEffect(() => { activeDateRef.current = activeDate; }, [activeDate]);
  useEffect(() => {
    saveDateState(activeDateRef.current, state);
    saveJSON(STORAGE_KEY, state);
  }, [state]);

  // When remote sync pushes new data into localStorage, rehydrate the reducer state
  // for the currently active date. Without this, the in-memory state would be stale.
  useRemoteUpdates((detail) => {
    if (!detail) return;
    if (detail.scope === "day" && detail.ds !== activeDateRef.current) return;
    const fresh = loadDateState(activeDateRef.current) || loadJSON(STORAGE_KEY);
    if (fresh) dispatch({ type: "HYDRATE", state: fresh });
  });
  useEffect(() => {
    document.documentElement.setAttribute("data-theme", dark?"dark":"light");
    document.getElementById("themeColorMeta").content = dark?"#131420":"#fdf6ee";
  }, [dark]);

  // Live clock — update every 30s for the now-indicator on the ring
  useEffect(() => {
    const tick = () => { const d = new Date(); setNowH(d.getHours() + d.getMinutes()/60 + d.getSeconds()/3600); };
    const id = setInterval(tick, 30000);
    return () => clearInterval(id);
  }, []);

  // Keyboard shortcuts
  useEffect(() => {
    const onKey = (e) => {
      const tag = (e.target && e.target.tagName) || "";
      const inForm = tag === "INPUT" || tag === "TEXTAREA" || (e.target && e.target.isContentEditable);
      if (e.key === "Escape") {
        if (editTask) setEditTask(null);
        else if (showSync) setShowSync(false);
        else if (showHelp) setShowHelp(false);
        else if (showSettings) setShowSettings(false);
        else if (showFavs) setShowFavs(false);
        return;
      }
      if (inForm) return;
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      if (e.key === "/") { e.preventDefault(); inputRef.current?.focus(); return; }
      if (e.key === "?") { e.preventDefault(); setShowHelp(v=>!v); return; }
      if (e.key.toLowerCase() === "d") { e.preventDefault(); dispatch({type:"DISTRIBUTE"}); setToast({msg:"Distributed evenly", type:"ok"}); setTimeout(()=>setToast(null), TOAST_MS); return; }
      if (e.key.toLowerCase() === "t") { e.preventDefault(); if (!isTodayDate) {
        saveDateState(activeDateRef.current, state);
        const loaded = loadDateState(todayStr());
        const next = loaded ? {...loaded, favs:state.favs, step:state.step, dark:state.dark} : blankDayState(state);
        dispatch({type:"FULL_REPLACE", data:next});
        setActiveDate(todayStr()); setActiveView("today"); setSelectedTaskId(null);
      } else { setActiveView("today"); } return; }
      if (e.key.toLowerCase() === "w") { e.preventDefault(); setActiveView(v=>v==="week"?"today":"week"); return; }
      if (e.key.toLowerCase() === "n") { e.preventDefault();
        const m=Math.floor(nowH*60); const newStart = Math.min(Math.ceil(m/state.step)*state.step/60, 23.5);
        dispatch({type:"SET_DAY_WINDOW", start:newStart, end:state.dayEnd});
        setToast({msg:"Start = now", type:"ok"}); setTimeout(()=>setToast(null), TOAST_MS); return;
      }
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [editTask, showSync, showHelp, showSettings, showFavs, isTodayDate, state, nowH]);

  // Compute which task is "now" (only when viewing today, in-window)
  const isTodayDate = activeDate === todayStr();
  const inWindow = (() => {
    if (!isTodayDate) return false;
    const s = state.dayStart, e = state.dayEnd;
    if (e >= s) return nowH >= s && nowH < e;
    return nowH >= s || nowH < e;
  })();
  const activeIdx = (() => {
    if (!inWindow || !state.tasks.length) return -1;
    let cursor = state.dayStart;
    for (let i = 0; i < state.tasks.length; i++) {
      const next = cursor + (state.tasks[i].hours || 0);
      const within = state.dayEnd >= state.dayStart
        ? (nowH >= cursor && nowH < next)
        : (((nowH - cursor + 24) % 24) < (state.tasks[i].hours || 0));
      if (within) return i;
      cursor = next;
    }
    return -1;
  })();
  const activeProgress = (() => {
    if (activeIdx < 0) return 0;
    let cursor = state.dayStart;
    for (let i = 0; i < activeIdx; i++) cursor += state.tasks[i].hours || 0;
    const len = state.tasks[activeIdx].hours || 0;
    if (len <= 0) return 0;
    const into = state.dayEnd >= state.dayStart ? (nowH - cursor) : (((nowH - cursor + 24) % 24));
    return Math.max(0, Math.min(1, into / len));
  })();

  const showToast = (msg, type="ok") => { setToast({msg, type}); setTimeout(()=>setToast(null), TOAST_MS); };

  const switchDate = (ds) => {
    saveDateState(activeDateRef.current, state);
    const loaded = loadDateState(ds);
    const next = loaded ? {...loaded, favs:state.favs, step:state.step, dark:state.dark} : blankDayState(state);
    dispatch({type:"FULL_REPLACE", data:next});
    setActiveDate(ds); setActiveView("today");
    setNewName(""); setEditTask(null); setSelectedTaskId(null);
  };
  const goToToday = () => switchDate(todayStr());

  const scheduleTask = (task, target) => {
    const targetLoaded = loadDateState(target);
    const targetS = targetLoaded ? {...targetLoaded} : blankDayState(state);
    targetS.tasks = [...(targetS.tasks||[]), {...task, id:Date.now()}];
    saveDateState(target, targetS);
    dispatch({type:"DEL_TASK", id:task.id});
    setEditTask(null);
    showToast(`Moved to ${formatDateShort(target)}`);
  };

  const addTask = (nameArg, colorArg, hoursArg) => {
    const name = (nameArg||newName).trim(); if (!name) return;
    if (tasks.some(t=>nameLc(t.name)===nameLc(name))) { showToast("Task already exists", "err"); return; }
    dispatch({type:"ADD_TASK", name, color:colorArg, hours:hoursArg});
    recordUsage(name);
    setNewName(""); inputRef.current?.blur();
  };

  const startLongDrag = (i, e) => {
    const cx = e.clientX, cy = e.clientY;
    clearTimeout(lpTimer.current);
    lpTimer.current = setTimeout(() => {
      try { if (navigator.vibrate) navigator.vibrate([10,30,10]); } catch {}
      setLongDragIdx(i); setDragPos({x:cx, y:cy});
    }, LONG_PRESS_MS);
  };
  const cancelLongPress = () => clearTimeout(lpTimer.current);

  useEffect(() => {
    if (longDragIdx === null) return;
    document.body.style.overflow = "hidden";
    const onMove = e => {
      if (e.cancelable) e.preventDefault();
      const cx = e.clientX, cy = e.clientY;
      setDragPos({x:cx, y:cy});
      const els = taskListRef.current?.querySelectorAll("[data-taskcard]"); if (!els) return;
      let found = null;
      for (let i=0;i<els.length;i++) {
        const r = els[i].getBoundingClientRect();
        if (cy>=r.top && cy<=r.bottom) { found=i; break; }
      }
      setDragOver(found!==null && found!==longDragIdx ? found : null);
    };
    const onUp = () => {
      if (dragOver!==null && longDragIdx!==null && dragOver!==longDragIdx) dispatch({type:"REORDER_TASKS", from:longDragIdx, to:dragOver});
      setLongDragIdx(null); setDragOver(null);
    };
    window.addEventListener("pointermove", onMove, {passive:false});
    window.addEventListener("pointerup", onUp);
    return () => {
      document.body.style.overflow = "";
      window.removeEventListener("pointermove", onMove);
      window.removeEventListener("pointerup", onUp);
    };
  }, [longDragIdx, dragOver]);

  const exportMD = () => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([serializeMD(tasks, dayStart, dayEnd)], {type:"text/markdown"}));
    a.download = "sliders.md"; a.click();
    showToast("Exported");
  };
  const handleFile = e => {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = ev => {
      const { tasks:p, dayStart:ds, dayEnd:de } = parseMD(ev.target.result);
      if (!p.length) { showToast("No tasks found", "err"); return; }
      dispatch({type:"SET_TASKS", tasks:p});
      if (ds!==null && de!==null && de>ds) dispatch({type:"SET_DAY_WINDOW", start:ds, end:de});
      showToast(`${p.length} tasks loaded`);
    };
    r.readAsText(f); e.target.value = "";
  };
  const handleSyncImport = (data, mode) => {
    if (mode==="full") { dispatch({type:"FULL_REPLACE", data}); showToast("Replaced"); }
    else { dispatch({type:"MERGE_IMPORT", data}); showToast("Merged"); }
  };

  const isToday = isTodayDate;
  const dayLabel = isToday ? "Today" : formatDateLabel(activeDate);
  const headerTotal = perfect ? formatHours(dl) : formatHours(Math.abs(remaining));

  return (
    <div className="app">
      {/* Header */}
      <div style={{position:"sticky", top:0, zIndex:20, background:"var(--bg)", borderBottom:"1px solid var(--border)"}}>
        <div style={{padding:"16px 20px 12px", display:"flex", alignItems:"center", justifyContent:"space-between", gap:12}}>
          <div style={{display:"flex", alignItems:"center", gap:10}}>
            <div style={{width:8, height:24, borderRadius:2, background:"linear-gradient(180deg, var(--accent-2), var(--accent), var(--accent-3))"}}/>
            <div>
              <div style={{fontSize:18, fontWeight:600, letterSpacing:"-0.02em", lineHeight:1}}>Sliders</div>
              <div style={{fontSize:11, color:"var(--text-3)", marginTop:2, fontFamily:"var(--font-mono)", display:"flex", gap:8, alignItems:"center"}}>
                <span className="tnum">{formatTime(nowH)}</span>
                <span style={{opacity:0.4}}>·</span>
                <span>{step}m</span>
                <HeaderSyncDot />
              </div>
            </div>
          </div>
          <div style={{display:"flex", alignItems:"center", gap:10}}>
            <div style={{textAlign:"right"}}>
              <div className="tnum" style={{fontSize:18, fontWeight:600, letterSpacing:"-0.01em", lineHeight:1, color: over?"var(--danger)":perfect?"var(--accent-2)":"var(--text)"}}>
                {headerTotal}
              </div>
              <div style={{fontSize:10, fontFamily:"var(--font-mono)", color:"var(--text-3)", letterSpacing:"0.06em", marginTop:3}}>
                {over?"OVER":perfect?"FULL":"FREE"}
              </div>
            </div>
            <button onClick={()=>dispatch({type:"SET_DARK", dark:!dark})} aria-label="Toggle theme" className="btn btn-ghost btn-icon">
              {dark
                ? <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
                : <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
              }
            </button>
            <button onClick={()=>setShowHelp(true)} aria-label="Keyboard shortcuts" title="Shortcuts (?)" className="btn btn-ghost btn-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
            </button>
          </div>
        </div>
        {/* Progress bar */}
        <div style={{height:2, background:"var(--bg-track)", position:"relative", overflow:"hidden"}}>
          <div style={{
            position:"absolute", left:0, top:0, bottom:0,
            width:`${Math.min(100,(total/dl)*100)}%`,
            background: over?"var(--danger)":perfect?"var(--accent-2)":"var(--accent)",
            transition:"width 0.3s, background 0.2s",
          }}/>
        </div>
        {/* Tabs */}
        <div className="tab-bar" style={{padding:"0 8px"}}>
          {!isToday && (
            <button onClick={goToToday} className="tab" style={{flex:"0 0 auto", padding:"0 14px"}}>Today</button>
          )}
          <button onClick={()=>setActiveView("today")} className={`tab ${activeView==="today"?"active":""}`}>
            {dayLabel}
          </button>
          <button onClick={()=>setActiveView("week")} className={`tab ${activeView==="week"?"active":""}`}>
            Week
          </button>
        </div>
      </div>

      {activeView === "today" ? (
        <div className="desktop-grid" style={{padding:"16px 20px"}}>
          <div className="col-left">
          {/* Hero: Day Window + Donut */}
          <div className="card" style={{padding:"20px", marginBottom:16, display:"flex", flexDirection:"column", alignItems:"center", gap:8}}>
            <div style={{position:"relative", width:RING_SIZE, height:RING_SIZE}}>
              <DayWindow dayStart={dayStart} dayEnd={dayEnd}
                nowHour={isToday ? nowH : undefined}
                onChange={(s,e)=>dispatch({type:"SET_DAY_WINDOW", start:s, end:e})}/>
              <svg width={RING_SIZE} height={RING_SIZE}
                style={{position:"absolute", top:0, left:0, pointerEvents:"none"}}>
                <g style={{pointerEvents:"auto"}}>
                  <Donut tasks={tasks} dayLen={dl} dayStart={dayStart}
                    selectedId={selectedTaskId}
                    onSelectTask={setSelectedTaskId}/>
                </g>
              </svg>
            </div>
            <div style={{display:"flex", alignItems:"center", gap:10, marginTop:6, flexWrap:"wrap", justifyContent:"center"}}>
              <div className="kbd tnum">{formatTime(dayStart)} → {formatTime(dayEnd)}</div>
              <div style={{fontSize:12, color:"var(--text-3)"}}>·</div>
              <div className="tnum" style={{fontSize:13, color:"var(--text-2)"}}>{formatHours(dl)} day</div>
              <button onClick={()=>{
                const now=new Date(), m=now.getHours()*60+now.getMinutes();
                const newStart = Math.min(Math.ceil(m/step)*step/60, 23.5);
                dispatch({type:"SET_DAY_WINDOW", start:newStart, end:dayEnd});
                showToast("Start = now");
              }} className="btn btn-ghost" style={{minHeight:32, padding:"0 12px", fontSize:12}}>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                Start now
              </button>
            </div>
          </div>

          {showTL && tasks.length>0 && <Timeline tasks={tasks} dayLen={dl} dayStart={dayStart}/>}
          </div>

          <div className="col-right">
          {/* Settings + Sync row */}
          <div style={{display:"flex", gap:8, marginBottom:14}}>
            <button onClick={()=>setShowSettings(v=>!v)} className="btn" style={{flex:1, justifyContent:"space-between", borderColor: showSettings?"var(--accent)":"var(--border)", color: showSettings?"var(--accent)":"var(--text-2)"}}>
              <span style={{display:"flex", alignItems:"center", gap:8}}>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                Settings
              </span>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" style={{transform:showSettings?"rotate(180deg)":"none", transition:"transform 0.2s"}}><polyline points="6 9 12 15 18 9"/></svg>
            </button>
            <button onClick={()=>setShowSync(true)} className="btn">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
              Sync
            </button>
          </div>

          {showSettings && (
            <Settings
              step={step} showTL={showTL} dayStart={dayStart} dayEnd={dayEnd} dark={dark}
              dispatch={dispatch}
              onExport={exportMD}
              onImportFile={()=>fileRef.current.click()}
              onSync={()=>setShowSync(true)}
              onReset={async ()=>{
                if (currentUser) {
                  try {
                    const uid = currentUser.uid;
                    await fbDb.collection("users").doc(uid).collection("meta").doc("main").delete().catch(()=>{});
                    const daysSnap = await fbDb.collection("users").doc(uid).collection("days").get();
                    const batch = fbDb.batch();
                    daysSnap.forEach(d => batch.delete(d.ref));
                    await batch.commit();
                  } catch (e) { console.warn("Cloud reset failed:", e); }
                }
                wipeLocalSlidersData();
                window.location.reload();
              }}/>
          )}
          <input ref={fileRef} type="file" accept=".md" style={{display:"none"}} onChange={handleFile}/>

          {/* Favourites */}
          {(favs.length>0 || showFavs) && (
            <div style={{marginBottom:14}}>
              <button onClick={()=>setShowFavs(v=>!v)} className="btn" style={{width:"100%", justifyContent:"space-between"}}>
                <span style={{display:"flex", alignItems:"center", gap:8}}>
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                  Favourites <span style={{color:"var(--text-3)", fontWeight:400}}>({favs.length})</span>
                </span>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" style={{transform:showFavs?"rotate(180deg)":"none", transition:"transform 0.2s"}}><polyline points="6 9 12 15 18 9"/></svg>
              </button>
              {showFavs && (
                <div className="card" style={{padding:"12px", marginTop:8, animation:"fadeUp 0.15s"}}>
                  {favs.length===0 ? (
                    <div style={{textAlign:"center", padding:"20px 0", fontSize:13, color:"var(--text-3)"}}>
                      Star a task to save it as a favourite
                    </div>
                  ) : (
                    <div style={{display:"flex", flexWrap:"wrap", gap:8}}>
                      {favs.map(f => {
                        const active = tasks.some(t=>nameLc(t.name)===nameLc(f.name));
                        const pending = confirmRm===f.name;
                        return (
                          <div key={f.name} style={{display:"flex", alignItems:"center", borderRadius:10, overflow:"hidden", border:`1px solid ${pending?"var(--danger)":active?f.color:"var(--border)"}`, opacity:active?0.5:1, transition:"all 0.15s"}}>
                            <button onClick={()=>{ if (pending) { setConfirmRm(null); return; } if (!active) addTask(f.name, f.color, f.hours); }}
                              style={{
                                background: pending?"color-mix(in oklab, var(--danger) 15%, transparent)":active?"transparent":`color-mix(in oklab, ${f.color} 12%, transparent)`,
                                border:"none", padding:"8px 12px", display:"flex", alignItems:"center", gap:8,
                                minHeight:40, cursor:active&&!pending?"default":"pointer",
                              }}>
                              <div style={{width:8, height:8, borderRadius:"50%", background:pending?"var(--danger)":f.color}}/>
                              <span style={{fontSize:13, color:active?"var(--text-3)":"var(--text)"}}>{pending?"Tap × to confirm":(f.name.length>16?f.name.slice(0,16)+"…":f.name)}</span>
                              {!pending && <span style={{fontFamily:"var(--font-mono)", fontSize:11, color:f.color, fontWeight:500}} className="tnum">{formatHours(f.hours)}</span>}
                            </button>
                            <button onClick={()=>{
                              if (pending) { dispatch({type:"DEL_FAV", name:f.name}); setConfirmRm(null); }
                              else { setConfirmRm(f.name); clearTimeout(confirmTimer.current); confirmTimer.current = setTimeout(()=>setConfirmRm(null), CONFIRM_MS); }
                            }} aria-label="Remove favourite" style={{
                              background:pending?"color-mix(in oklab, var(--danger) 15%, transparent)":"transparent",
                              border:"none", borderLeft:`1px solid ${pending?"var(--danger)":"var(--border)"}`,
                              padding:"0 12px", color:pending?"var(--danger)":"var(--text-4)", minHeight:40, cursor:"pointer",
                            }}>
                              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                            </button>
                          </div>
                        );
                      })}
                    </div>
                  )}
                </div>
              )}
            </div>
          )}

          {/* Tasks */}
          <div style={{marginBottom:14}}>
            <div style={{display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:10}}>
              <div className="label">Tasks</div>
              {tasks.length>1 && (
                <button onClick={()=>{dispatch({type:"DISTRIBUTE"}); showToast("Distributed evenly");}}
                  className="btn btn-ghost" style={{minHeight:32, padding:"0 12px", fontSize:12, color:"var(--text-3)"}}>
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
                  Distribute evenly
                </button>
              )}
            </div>

            {tasks.length===0 && (
              <div style={{textAlign:"center", padding:"40px 20px", borderRadius:14, border:"1px dashed var(--border)"}}>
                <div style={{fontSize:14, color:"var(--text-2)", marginBottom:6, fontWeight:500}}>No tasks yet</div>
                <div style={{fontSize:13, color:"var(--text-3)"}}>Add one below to start sliding</div>
              </div>
            )}

            <div ref={taskListRef} style={{opacity:longDragIdx!==null?0.92:1, transition:"opacity 0.2s"}}>
              {tasks.map((t, i) => {
                const tStart = (() => { let c = dayStart; for (let j=0;j<i;j++) c+=tasks[j].hours||0; return c; })();
                const isFloat = longDragIdx === i;
                const isOver = dragOver === i;
                return (
                  <div key={t.id} data-taskcard={i} style={{
                    opacity: isFloat ? 0.25 : 1,
                    transform: isOver ? "translateY(-3px)" : isFloat ? "scale(0.98)" : "none",
                    transition: "all 0.15s",
                  }}>
                    <TaskCard task={t} taskStart={tStart} stepMinutes={step} dayLen={dl}
                      isActive={isToday && activeIdx===i}
                      progress={isToday && activeIdx===i ? activeProgress : undefined}
                      onChange={p=>dispatch({type:"UPD_TASK", id:t.id, patch:p})}
                      onDelete={()=>dispatch({type:"DEL_TASK", id:t.id})}
                      onEdit={()=>setEditTask({...t})}
                      onLock={()=>dispatch({type:"UPD_TASK", id:t.id, patch:{locked:!t.locked}})}
                      isFav={favs.some(f=>nameLc(f.name)===nameLc(t.name))}
                      onFav={()=>dispatch({type:favs.some(f=>nameLc(f.name)===nameLc(t.name))?"DEL_FAV":"ADD_FAV", name:t.name, task:t})}
                      onLongPressStart={e=>startLongDrag(i,e)}
                      onLongPressEnd={cancelLongPress}/>
                  </div>
                );
              })}
            </div>
          </div>

          {longDragIdx!==null && tasks[longDragIdx] && (() => {
            const t = tasks[longDragIdx];
            return (
              <div style={{
                position:"fixed", left:dragPos.x-140, top:dragPos.y-28,
                width:280, zIndex:300, pointerEvents:"none",
                filter:`drop-shadow(0 12px 32px ${t.color}66)`,
              }}>
                <div className="card" style={{
                  padding:"12px 16px", display:"flex", alignItems:"center", gap:10,
                  borderColor:t.color, transform:"rotate(-1deg) scale(1.04)",
                }}>
                  <div style={{width:10, height:10, borderRadius:"50%", background:t.color}}/>
                  <span style={{fontSize:14, color:"var(--text)", flex:1, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap"}}>{t.name}</span>
                  <span className="tnum" style={{fontFamily:"var(--font-mono)", fontSize:12, color:t.color, fontWeight:600}}>{formatHours(t.hours)}</span>
                </div>
              </div>
            );
          })()}

          {/* Add task */}
          {(() => {
            const topUsed = getTopUsed(3).filter(name => !tasks.some(t=>nameLc(t.name)===name));
            return (
              <div style={{position:"relative", display:"flex", gap:8, marginBottom:24}}>
                {inputFocused && topUsed.length>0 && (
                  <div style={{
                    position:"absolute", bottom:"calc(100% + 8px)", left:0, right:0,
                    zIndex:50, display:"flex", gap:6, padding:"8px",
                    background:"var(--bg-elev)", border:"1px solid var(--border)",
                    borderRadius:12, boxShadow:"0 -8px 24px rgba(0,0,0,0.4)",
                    animation:"fadeUp 0.15s",
                  }}>
                    {topUsed.map(name => {
                      const fav = favs.find(f=>nameLc(f.name)===name);
                      const c = fav?.color || PALETTE[0];
                      return (
                        <button key={name} onMouseDown={e=>{e.preventDefault(); addTask(name, fav?.color, fav?.hours);}}
                          style={{
                            flex:1, background:`color-mix(in oklab, ${c} 12%, transparent)`,
                            border:`1px solid color-mix(in oklab, ${c} 30%, transparent)`,
                            borderRadius:8, padding:"8px 10px", display:"flex", alignItems:"center", gap:6,
                            cursor:"pointer", minWidth:0, overflow:"hidden",
                          }}>
                          <div style={{width:7, height:7, borderRadius:"50%", background:c, flexShrink:0}}/>
                          <span style={{fontSize:12, color:"var(--text)", overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap"}}>{name.length>12?name.slice(0,12)+"…":name}</span>
                        </button>
                      );
                    })}
                  </div>
                )}
                <input ref={inputRef} value={newName} onChange={e=>setNewName(e.target.value)}
                  onKeyDown={e=>e.key==="Enter"&&addTask()}
                  placeholder="Add a task…" className="input"
                  style={{flex:1, minHeight:52, fontSize:15}}
                  onFocus={()=>setInputFocused(true)}
                  onBlur={()=>setTimeout(()=>setInputFocused(false), 150)}/>
                <button onClick={()=>addTask()} className="btn btn-primary" style={{minHeight:52, minWidth:80, fontSize:15}}>Add</button>
              </div>
            );
          })()}
          </div>
        </div>
      ) : (
        <WeekView step={step} todayTasks={tasks} onDateSelect={switchDate} activeDate={activeDate}/>
      )}

      {editTask && <EditModal task={editTask}
        onSave={p=>{dispatch({type:"UPD_TASK", id:editTask.id, patch:p}); setEditTask(null); showToast("Task updated");}}
        onSchedule={d=>scheduleTask(editTask, d)}
        onClose={()=>setEditTask(null)}/>}
      {showSync && <SyncModal state={state} onImport={handleSyncImport} onClose={()=>setShowSync(false)}/>}
      {showHelp && <HelpModal onClose={()=>setShowHelp(false)}/>}
      {toast && <div className={`toast ${toast.type==="err"?"err":""}`}><span className="dot"/>{toast.msg}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
