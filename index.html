<style>
:root {
  --bg: #131420;
  --bg-elev: #1b1d2e;
  --bg-elev-2: #242639;
  --bg-input: #1f2134;
  --bg-track: #2c2e44;
  --border: #2a2c40;
  --border-strong: #3a3d56;
  --text: #f3eef0;
  --text-2: #cfc8d1;
  --text-3: #8d8898;
  --text-4: #5d5969;
  --accent: #ff7a5c;         /* coral */
  --accent-2: #5dd6c5;       /* turquoise */
  --accent-3: #ffd166;       /* sun yellow */

  --success: #5dd6c5;

  --font-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.25);
  --shadow-md: 0 4px 16px rgba(0,0,0,0.35);
  --shadow-lg: 0 12px 40px rgba(0,0,0,0.45);
}
[data-theme="light"] {
  --bg: #fdf6ee;
  --bg-elev: #ffffff;
  --bg-elev-2: #f4ebe0;
  --bg-input: #f8f0e5;
  --bg-track: #ebe0d2;
  --border: #ecdfcd;
  --border-strong: #d4c2a8;
  --text: #1d1f2c;
  --text-2: #3a3d4e;
  --text-3: #6b6e80;
  --text-4: #98a;
  --accent: #ee5a3a;
  --accent-2: #1aa794;
  --accent-3: #d99019;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  min-height: 100dvh;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-sans);
  font-feature-settings: "ss01", "cv11";
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overscroll-behavior-y: none;
  transition: background 0.3s ease, color 0.3s ease;
}
textarea, input { outline: none; -webkit-appearance: none; appearance: none; font-family: inherit; }
button { -webkit-appearance: none; appearance: none; touch-action: manipulation; cursor: pointer; font-family: inherit; }
input[type="text"], input[type="color"], textarea, input[type="date"] { font-size: 16px !important; }
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-thumb { border-radius: 3px; background: var(--border-strong); }
::-webkit-scrollbar-track { background: transparent; }

@keyframes fadeIn  { from { opacity:0 } to { opacity:1 } }
@keyframes fadeUp  { from { opacity:0; transform:translateY(8px) } to { opacity:1; transform:translateY(0) } }
@keyframes slideUp { from { opacity:0; transform:translateY(16px) } to { opacity:1; transform:translateY(0) } }
@keyframes toastIn { from { opacity:0; transform:translate(-50%,8px) } to { opacity:1; transform:translate(-50%,0) } }
@keyframes pulse   { 0%,100%{opacity:0.6} 50%{opacity:1} }

.app { max-width: 560px; margin: 0 auto; min-height: 100dvh; padding-bottom: 120px; }
@media (min-width: 720px) { .app { max-width: 640px; } }

/* Desktop two-column layout */
@media (min-width: 980px) {
  .app { max-width: 1100px; padding-bottom: 60px; }
  .desktop-grid {
    display: grid;
    grid-template-columns: 380px 1fr;
    gap: 24px;
    align-items: start;
  }
  .desktop-grid > .col-left {
    position: sticky;
    top: 130px;
    align-self: start;
  }

/* Focus rings — keyboard accessibility */
button:focus-visible, input:focus-visible, textarea:focus-visible, [role="button"]:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
.btn:focus-visible { outline-offset: 1px; }

/* Hover affordances on desktop */
@media (hover: hover) and (pointer: fine) {
  .task-row:hover .row-nudge { opacity: 1; }
  .row-nudge { opacity: 0; transition: opacity 0.15s; }
}

/* Help shortcut hint badges */
.shortcut-hint {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: var(--font-mono); font-size: 11px; color: var(--text-3);
}

.modal-overlay {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(8,9,15,0.65); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  display: flex; align-items: flex-end; justify-content: center;
  animation: fadeIn 0.18s ease;
}
.modal-sheet {
  width: 100%; max-width: 520px;
  background: var(--bg-elev); border: 1px solid var(--border);
  border-radius: var(--radius-lg) var(--radius-lg) 0 0;
  animation: slideUp 0.22s cubic-bezier(.2,.8,.2,1);
  max-height: 92dvh; overflow-y: auto;
}
@media (min-width: 600px) {
  .modal-overlay { align-items: center; padding: 24px; }
  .modal-sheet { border-radius: var(--radius-lg); max-width: 480px; }
}

.btn {
  display: inline-flex; align-items: center; justify-content: center;
  gap: 8px; min-height: var(--tap); padding: 0 18px;
  border-radius: var(--radius-sm); border: 1px solid var(--border);
  background: var(--bg-elev-2); color: var(--text);
  font-size: 14px; font-weight: 500; letter-spacing: -0.01em;
  transition: all 0.15s ease;
}
.btn:hover { border-color: var(--border-strong); background: var(--bg-input); }
.btn-primary {
  background: var(--accent); color: #0a0b12; border-color: transparent;
  font-weight: 600;
}
.btn-primary:hover { background: color-mix(in oklab, var(--accent) 90%, white); }
.btn-ghost { background: transparent; }
.btn-ghost:hover { background: var(--bg-elev-2); }
.btn-icon { width: var(--tap); padding: 0; }
.btn-danger { color: var(--danger); border-color: color-mix(in oklab, var(--danger) 30%, var(--border)); }
.btn-danger:hover { background: color-mix(in oklab, var(--danger) 10%, var(--bg-elev-2)); }

.input {
  width: 100%; min-height: var(--tap);
  background: var(--bg-input); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 0 16px;
  color: var(--text); font-size: 15px; letter-spacing: -0.01em;
  transition: border-color 0.15s ease;
}
.input:focus { border-color: var(--accent); }

.card {
  background: var(--bg-elev); border: 1px solid var(--border);
  border-radius: var(--radius);
}

.label {
  font-family: var(--font-mono); font-size: 11px;
  color: var(--text-3); letter-spacing: 0.06em; text-transform: uppercase;
  font-weight: 500;
}

.kbd {
  font-family: var(--font-mono); font-size: 11px; font-weight: 500;
  color: var(--text-3); background: var(--bg-elev-2);
  border: 1px solid var(--border); border-radius: 6px;
  padding: 2px 6px;
}

.divider { height: 1px; background: var(--border); margin: 12px 0; }

/* Tab indicator underline */
.tab-bar { display: flex; gap: 2px; padding: 0 4px; }
.tab {
  flex: 1; min-height: var(--tap); padding: 0 12px;
  background: transparent; border: none; color: var(--text-3);
  font-size: 13px; font-weight: 500; letter-spacing: -0.01em;
  position: relative; transition: color 0.15s;
  display: flex; align-items: center; justify-content: center; gap: 6px;
}
.tab:hover { color: var(--text-2); }
.tab.active { color: var(--text); }
.tab.active::after {
  content: ""; position: absolute; left: 12px; right: 12px; bottom: -1px;
  height: 2px; background: var(--accent); border-radius: 2px 2px 0 0;
}

.toast {
  position: fixed; bottom: calc(24px + env(safe-area-inset-bottom,0px));
  left: 50%; transform: translateX(-50%);
  background: var(--bg-elev); border: 1px solid var(--border);
  border-radius: 999px; padding: 10px 18px;
  font-size: 13px; color: var(--text);
  box-shadow: var(--shadow-lg);
  animation: toastIn 0.22s cubic-bezier(.2,.8,.2,1);
  z-index: 200;
  display: inline-flex; align-items: center; gap: 8px;
}
.toast .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent-2); }
.toast.err .dot { background: var(--danger); }

/* Number tabular for time */
.tnum { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }

/* Scroll snap for compact rows */
.no-select { user-select: none; -webkit-user-select: none; }

</style>

<body>
<div id="root"></div>
<script type="text/babel" data-presets="env,react" src="tweaks.jsx"></script>
<script type="text/babel" data-presets="env,react">
const { useState, useRef, useEffect, useCallback, useReducer, useMemo } = React;

/* ─────────── Storage & helpers ─────────── */
const STORAGE_KEY = "sliders_data";
const WEEK_KEY = "sliders_week_v1";
const USAGE_KEY = "sliders_task_usage";
const TWEAK_KEY = "sliders_tweaks_v1";
const DAY_KEY = ds => `sliders_day_${ds}`;
const DAYS = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];

function loadJSON(k, def=null) { try { const r = localStorage.getItem(k); return r ? JSON.parse(r) : def; } catch { return def; } }
function saveJSON(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }

function dateStr(d) { const dd = d instanceof Date ? d : new Date(d); return `${dd.getFullYear()}-${String(dd.getMonth()+1).padStart(2,"0")}-${String(dd.getDate()).padStart(2,"0")}`; }
function todayStr() { return dateStr(new Date()); }
function tomorrowStr() { const d = new Date(); d.setDate(d.getDate()+1); return dateStr(d); }
function formatDateLabel(str) {
  if (!str) return "—";
  const d = new Date(str + "T00:00:00");
  const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const days = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  return `${days[d.getDay()]} ${months[d.getMonth()]} ${d.getDate()}`;
}
function formatDateShort(str) {
  if (!str) return "—";
  const d = new Date(str + "T00:00:00");
  const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return `${months[d.getMonth()]} ${d.getDate()}`;
}

function loadDateState(ds) {
  const r = loadJSON(DAY_KEY(ds));
  if (r) return r;
  if (ds === todayStr()) return loadJSON(STORAGE_KEY);
  return null;
}
function saveDateState(ds, s) { saveJSON(DAY_KEY(ds), s); }
function getDatesWithTasks() {
  const result = {};
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const key = localStorage.key(i);
      if (key?.startsWith("sliders_day_")) {
        const ds = key.replace("sliders_day_", "");
        const data = JSON.parse(localStorage.getItem(key));
        if (data?.tasks?.length > 0) result[ds] = data.tasks;
      }
    }
  } catch {}
  return result;
}

function loadUsage() { return loadJSON(USAGE_KEY, {}); }
function recordUsage(name) { const u = loadUsage(); const k = name.toLowerCase().trim(); u[k] = (u[k]||0)+1; saveJSON(USAGE_KEY, u); }
function getTopUsed(n=3) {
  const u = loadUsage();
  return Object.entries(u).sort((a,b)=>b[1]-a[1]).slice(0,n).map(([k])=>k);
}

/* ─────────── Firebase Sync Layer ─────────── */
const SYNC_KEYS = ["sliders_data", "sliders_week_v1", "sliders_task_usage", "sliders_tweaks_v1"];
const PENDING_WRITES_KEY = "sliders_pending_writes";
const SYNC_EVENT = "sliders-remote-update";
const STATUS_EVENT = "sliders-sync-status";
const AUTH_EVENT = "sliders-auth-change";

const fbAuth = firebase.auth();
const fbDb = firebase.firestore();
const googleProvider = new firebase.auth.GoogleAuthProvider();

let currentUser = null;
let syncStatus = "guest";
let unsubMeta = null;
let unsubDays = null;
let suppressLocalEcho = false;
const pendingTimers = { meta: null, days: {} };

function setSyncStatus(s) {
  syncStatus = s;
  window.dispatchEvent(new CustomEvent(STATUS_EVENT, { detail: s }));
}
function getSyncStatus() { return syncStatus; }

const _origSaveJSON = saveJSON;
const _origSaveDateState = saveDateState;
saveJSON = function(k, v) {
  _origSaveJSON(k, v);
  if (suppressLocalEcho) return;
  if (currentUser && SYNC_KEYS.includes(k)) scheduleMetaWrite();
};
saveDateState = function(ds, s) {
  _origSaveDateState(ds, s);
  if (suppressLocalEcho) return;
  if (currentUser) scheduleDayWrite(ds);
};

function buildMetaPayload() {
  const payload = { updatedAt: firebase.firestore.FieldValue.serverTimestamp() };
  for (const k of SYNC_KEYS) {
    const v = loadJSON(k);
    if (v !== null) payload[k] = v;
  }
  return payload;
}
function buildDayPayload(ds) {
  const v = loadJSON(`sliders_day_${ds}`);
  if (!v) return null;
  if (Array.isArray(v.tasks) && v.tasks.length > 500) {
    console.warn("Day has >500 tasks, skipping cloud sync for", ds);
    return null;
  }
  return { ...v, updatedAt: firebase.firestore.FieldValue.serverTimestamp() };
}

function scheduleMetaWrite() {
  if (!currentUser) return;
  setSyncStatus("pending");
  clearTimeout(pendingTimers.meta);
  pendingTimers.meta = setTimeout(async () => {
    if (!currentUser) return;
    try {
      await fbDb.collection("users").doc(currentUser.uid).collection("meta").doc("main").set(buildMetaPayload(), { merge: true });
      setSyncStatus("synced");
    } catch (e) {
      console.warn("Meta write failed:", e);
      queuePendingWrite({ type: "meta" });
      setSyncStatus(navigator.onLine ? "error" : "offline");
    }
  }, 1500);
}
function scheduleDayWrite(ds) {
  if (!currentUser) return;
  setSyncStatus("pending");
  clearTimeout(pendingTimers.days[ds]);
  pendingTimers.days[ds] = setTimeout(async () => {
    if (!currentUser) return;
    const payload = buildDayPayload(ds);
    if (!payload) return;
    try {
      await fbDb.collection("users").doc(currentUser.uid).collection("days").doc(ds).set(payload, { merge: true });
      setSyncStatus("synced");
    } catch (e) {
      console.warn("Day write failed for", ds, e);
      queuePendingWrite({ type: "day", ds });
      setSyncStatus(navigator.onLine ? "error" : "offline");
    }
  }, 1500);
}

function queuePendingWrite(item) {
  const q = loadJSON(PENDING_WRITES_KEY, []);
  const key = item.type === "day" ? `day:${item.ds}` : "meta";
  const exists = q.some(x => (x.type === "day" ? `day:${x.ds}` : "meta") === key);
  if (!exists) { q.push(item); _origSaveJSON(PENDING_WRITES_KEY, q); }
}
async function flushPendingWrites() {
  if (!currentUser) return;
  const q = loadJSON(PENDING_WRITES_KEY, []);
  if (!q.length) return;
  for (const item of q) {
    try {
      if (item.type === "meta") {
        await fbDb.collection("users").doc(currentUser.uid).collection("meta").doc("main").set(buildMetaPayload(), { merge: true });
      } else if (item.type === "day") {
        const payload = buildDayPayload(item.ds);
        if (payload) await fbDb.collection("users").doc(currentUser.uid).collection("days").doc(item.ds).set(payload, { merge: true });
      }
    } catch (e) { console.warn("Flush failed:", e); return; }
  }
  _origSaveJSON(PENDING_WRITES_KEY, []);
  setSyncStatus("synced");
}

function applyRemoteMeta(data) {
  if (!data) return;
  suppressLocalEcho = true;
  try {
    for (const k of SYNC_KEYS) {
      if (data[k] !== undefined) _origSaveJSON(k, data[k]);
    }
  } finally { suppressLocalEcho = false; }
  window.dispatchEvent(new CustomEvent(SYNC_EVENT, { detail: { scope: "meta" } }));
}
function applyRemoteDay(ds, data) {
  if (!data) return;
  suppressLocalEcho = true;
  try {
    const { updatedAt, ...clean } = data;
    _origSaveJSON(`sliders_day_${ds}`, clean);
    if (ds === todayStr()) _origSaveJSON(STORAGE_KEY, clean);
  } finally { suppressLocalEcho = false; }
  window.dispatchEvent(new CustomEvent(SYNC_EVENT, { detail: { scope: "day", ds } }));
}

function startListeners(uid) {
  stopListeners();
  unsubMeta = fbDb.collection("users").doc(uid).collection("meta").doc("main")
    .onSnapshot(snap => {
      if (!snap.exists) return;
      if (snap.metadata.hasPendingWrites) return;
      applyRemoteMeta(snap.data());
    }, err => console.warn("Meta listener error:", err));
  unsubDays = fbDb.collection("users").doc(uid).collection("days")
    .onSnapshot(snap => {
      snap.docChanges().forEach(ch => {
        if (ch.doc.metadata.hasPendingWrites) return;
        if (ch.type === "added" || ch.type === "modified") applyRemoteDay(ch.doc.id, ch.doc.data());
      });
    }, err => console.warn("Days listener error:", err));
}
function stopListeners() {
  if (unsubMeta) { unsubMeta(); unsubMeta = null; }
  if (unsubDays) { unsubDays(); unsubDays = null; }
}

async function performInitialSync(user) {
  const uid = user.uid;
  const metaDoc = await fbDb.collection("users").doc(uid).collection("meta").doc("main").get();
  const daysSnap = await fbDb.collection("users").doc(uid).collection("days").get();
  const remoteHasData = metaDoc.exists || !daysSnap.empty;
  const localHasData = SYNC_KEYS.some(k => loadJSON(k) !== null) || Object.keys(getDatesWithTasks()).length > 0;
  if (remoteHasData && !localHasData) {
    if (metaDoc.exists) applyRemoteMeta(metaDoc.data());
    daysSnap.forEach(d => applyRemoteDay(d.id, d.data()));
    return { mode: "downloaded" };
  }
  if (!remoteHasData && localHasData) {
    await uploadAllLocal(uid);
    return { mode: "uploaded" };
  }
  if (remoteHasData && localHasData) {
    if (metaDoc.exists) applyRemoteMeta(metaDoc.data());
    const remoteDayIds = new Set();
    daysSnap.forEach(d => { remoteDayIds.add(d.id); applyRemoteDay(d.id, d.data()); });
    const localDays = getDatesWithTasks();
    for (const ds of Object.keys(localDays)) {
      if (!remoteDayIds.has(ds)) {
        const payload = buildDayPayload(ds);
        if (payload) await fbDb.collection("users").doc(uid).collection("days").doc(ds).set(payload, { merge: true });
      }
    }
    return { mode: "merged" };
  }
  return { mode: "empty" };
}
async function uploadAllLocal(uid) {
  await fbDb.collection("users").doc(uid).collection("meta").doc("main").set(buildMetaPayload(), { merge: true });
  for (let i = 0; i < localStorage.length; i++) {
    const key = localStorage.key(i);
    if (key?.startsWith("sliders_day_")) {
      const ds = key.replace("sliders_day_", "");
      const payload = buildDayPayload(ds);
      if (payload) await fbDb.collection("users").doc(uid).collection("days").doc(ds).set(payload, { merge: true });
    }
  }
}

function wipeLocalSlidersData() {
  const keys = [];
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k?.startsWith("sliders_")) keys.push(k);
  }
  keys.forEach(k => localStorage.removeItem(k));
}

async function signInWithGoogle() {
  try { await fbAuth.signInWithPopup(googleProvider); }
  catch (e) {
    console.warn("Sign-in failed:", e);
    window.dispatchEvent(new CustomEvent("sliders-toast", { detail: { msg: "Sign-in failed: " + (e.message || e.code), type: "error" } }));
  }
}
async function signOutUser() {
  try {
    stopListeners();
    await fbAuth.signOut();
    wipeLocalSlidersData();
    window.location.reload();
  } catch (e) { console.warn("Sign-out failed:", e); }
}

fbAuth.onAuthStateChanged(async (user) => {
  currentUser = user;
  if (user) {
    setSyncStatus("pending");
    try {
      await performInitialSync(user);
      startListeners(user.uid);
      await flushPendingWrites();
      setSyncStatus("synced");
    } catch (e) {
      console.warn("Initial sync failed:", e);
      setSyncStatus("error");
    }
  } else {
    stopListeners();
    setSyncStatus("guest");
  }
  window.dispatchEvent(new CustomEvent(AUTH_EVENT, { detail: user ? { uid: user.uid, email: user.email, displayName: user.displayName, photoURL: user.photoURL } : null }));
});

const PALETTE = [
  "#ff7a5c", "#5dd6c5", "#ffd166", "#a78bfa", "#06b6d4",
  "#f472b6", "#84cc16", "#fb923c", "#60a5fa", "#c084fc",
  "#34d399", "#fbbf24", "#f87171",
];
const STEPS = [{l:"5m",m:5},{l:"10m",m:10},{l:"15m",m:15},{l:"30m",m:30}];
const DEFAULT_TASKS = [
  { id:1, name:"Sleep",    hours:8, originalHours:8, color:PALETTE[6], locked:false, actual:0 },
  { id:2, name:"Deep work", hours:4, originalHours:4, color:PALETTE[0], locked:false, actual:0 },
  { id:3, name:"Movement", hours:1, originalHours:1, color:PALETTE[1], locked:false, actual:0 },
];
const TOL = 0.001, TOL_SLIDER = 0.0005, TOL_ANGLE = 0.0008;
const LERP = 0.3, LERP_DONUT = 0.22, LERP_RING = 0.22;
const LONG_PRESS_MS = 380, TOAST_MS = 2200, CONFIRM_MS = 3000;

function formatHours(h) {
  const m = Math.round(h * 60), hh = Math.floor(m / 60), mm = m % 60;
  return hh === 0 ? `${mm}m` : mm === 0 ? `${hh}h` : `${hh}h ${mm}m`;
}
function formatTime(h) {
  const total = Math.round(((h % 24) + 24) % 24 * 60);
  const hh = Math.floor(total / 60) % 24, mm = total % 60;
  return `${String(hh).padStart(2,"0")}:${String(mm).padStart(2,"0")}`;
}
function taskTimeRange(tasks, idx, dayStart) {
  let cursor = dayStart;
  for (let i = 0; i < idx; i++) cursor += tasks[i].hours || 0;
  return { start: cursor, end: cursor + (tasks[idx].hours || 0) };
}
const snapToStep = (h, s) => Math.round(h * 60 / s) * s / 60;
const calcDayLen = (s, e) => e >= s ? e - s : (24 - s) + e;
const nameLc = n => n.toLowerCase();

function scaleTasksToTotal(tasks, target) {
  if (!tasks.length) return tasks;
  const sum = tasks.reduce((s, t) => s + (t.hours || 0), 0);
  if (target >= sum - TOL || sum <= 0) return tasks;
  const tMin = Math.round(target * 60);
  let used = 0;
  const mins = tasks.map((t, i) => {
    if (i === tasks.length - 1) return Math.max(0, tMin - used);
    const m = Math.round((t.hours || 0) / sum * tMin); used += m; return m;
  });
  return tasks.map((t, i) => ({ ...t, hours: Math.max(0, mins[i] / 60) }));
}

function parseMD(text) {
  const tasks = []; let dayStart = null, dayEnd = null;
  for (const line of text.split("\n")) {
    const dm = line.match(/^> Day: (\d+(?:\.\d+)?):(\d+) → (\d+(?:\.\d+)?):(\d+)/);
    if (dm) { dayStart = +dm[1] + (dm[2]==="30"?.5:0); dayEnd = +dm[3] + (dm[4]==="30"?.5:0); }
    const tm = line.match(/^## (.+?) \[(\d+(?:\.\d+)?)h\] (#[0-9a-fA-F]{6})?/);
    if (tm) tasks.push({ id: Date.now()+Math.random(), name:tm[1].trim(), hours:+tm[2], originalHours:+tm[2], color:tm[3]||PALETTE[tasks.length%PALETTE.length], locked:false, actual:0 });
  }
  return { tasks, dayStart, dayEnd };
}
function serializeMD(tasks, s=0, e=24) {
  const dl = calcDayLen(s, e), total = tasks.reduce((a,t)=>a+t.hours,0);
  const tt = h => `${String(Math.floor(h)).padStart(2,"0")}:${h%1?"30":"00"}`;
  let out = `# Sliders — Daily Time Allocation\n\n> Day: ${tt(s)} → ${tt(e)} (${formatHours(dl)})\n> Total: ${formatHours(total)} / ${formatHours(dl)}\n\n---\n\n`;
  for (const t of tasks) out += `## ${t.name} [${t.hours.toFixed(4)}h] ${t.color}\n- Planned: ${formatHours(t.hours)}\n\n`;
  return out + `---\n_Generated by Sliders_\n`;
}

function encodeSync(state) {
  try { return btoa(unescape(encodeURIComponent(JSON.stringify({...state, v:1, ts:Date.now()})))); } catch { return null; }
}
function decodeSync(str) {
  try { const d = JSON.parse(decodeURIComponent(escape(atob(str.trim())))); return d.tasks ? d : null; } catch { return null; }
}

function loadWeek() { return loadJSON(WEEK_KEY) || Array.from({length:7}, (_,i) => ({ dayIdx:i, tasks:[], note:"" })); }
function weekTotalHours(d) { return d.tasks.reduce((s,t)=>s+(t.hours||0),0); }

/* ─────────── State ─────────── */
function initState() {
  const s = loadDateState(todayStr()) || loadJSON(STORAGE_KEY);
  return {
    tasks: s?.tasks ?? DEFAULT_TASKS,
    favs: s?.favs ?? [],
    step: s?.step ?? 15,
    dark: s?.dark ?? true,
    showTL: s?.showTL ?? true,
    dayStart: s?.dayStart ?? 8,
    dayEnd: s?.dayEnd ?? 22,
  };
}
function blankDayState(base) {
  return { tasks:[], favs:base.favs, step:base.step, dark:base.dark, showTL:base.showTL, dayStart:base.dayStart, dayEnd:base.dayEnd };
}

function reducer(state, action) {
  const dl = calcDayLen(state.dayStart, state.dayEnd);
  switch (action.type) {
    case "HYDRATE": return { ...state, ...action.state };
    case "ADD_TASK": {
      const { name, color, hours } = action;
      const fav = state.favs.find(f => nameLc(f.name)===nameLc(name));
      const rem = Math.max(0, dl - state.tasks.reduce((s,t)=>s+t.hours,0));
      const h = Math.max(0, Math.min(hours??fav?.hours??snapToStep(Math.min(state.step/60,rem),state.step), rem||state.step/60));
      return { ...state, tasks: [...state.tasks, { id:Date.now(), name, hours:h, originalHours:h, color:color||fav?.color||PALETTE[state.tasks.length%PALETTE.length], locked:false, actual:0 }] };
    }
    case "UPD_TASK": {
      const orig = state.tasks.find(t=>t.id===action.id);
      const tasks = state.tasks.map(t => {
        if (t.id!==action.id) return t;
        const u = {...t,...action.patch};
        if (action.patch.hours!==undefined) u.originalHours = action.patch.hours;
        return u;
      });
      let favs = state.favs;
      if ((action.patch.hours!==undefined||action.patch.color!==undefined) && orig && favs.some(f=>nameLc(f.name)===nameLc(orig.name)))
        favs = favs.map(f => nameLc(f.name)===nameLc(orig.name) ? {...f,...(action.patch.hours!==undefined&&{hours:action.patch.hours}),...(action.patch.color!==undefined&&{color:action.patch.color})} : f);
      return { ...state, tasks, favs };
    }
    case "DEL_TASK":   return { ...state, tasks: state.tasks.filter(t=>t.id!==action.id) };
    case "SET_TASKS":  return { ...state, tasks: action.tasks };
    case "ADD_FAV": {
      const t = action.task;
      if (state.favs.some(f=>nameLc(f.name)===nameLc(t.name))) return state;
      return { ...state, favs: [...state.favs, {name:t.name,hours:t.hours,color:t.color}] };
    }
    case "DEL_FAV":    return { ...state, favs: state.favs.filter(f=>nameLc(f.name)!==nameLc(action.name)) };
    case "DISTRIBUTE": {
      const unlocked = state.tasks.filter(t=>!t.locked);
      if (!unlocked.length) return state;
      const h = snapToStep((dl - state.tasks.filter(t=>t.locked).reduce((s,t)=>s+t.hours,0)) / unlocked.length, state.step);
      return { ...state, tasks: state.tasks.map(t=>t.locked?t:{...t,hours:h,originalHours:h}) };
    }
    case "SET_DAY_WINDOW": {
      const { start, end } = action;
      const nl = calcDayLen(start, end);
      if (nl < 0.5) return state;
      const restored = nl > dl ? state.tasks.map(t=>({...t,hours:t.originalHours??t.hours})) : state.tasks;
      return { ...state, dayStart:start, dayEnd:end, tasks:scaleTasksToTotal(restored,nl) };
    }
    case "REORDER_TASKS": {
      const tasks = [...state.tasks];
      tasks.splice(action.to, 0, tasks.splice(action.from, 1)[0]);
      return { ...state, tasks };
    }
    case "SET_STEP":    return { ...state, step:action.step };
    case "SET_DARK":    return { ...state, dark:action.dark };
    case "SET_SHOW_TL": return { ...state, showTL:action.v };
    case "FULL_REPLACE": {
      const d = action.data;
      return { ...state, tasks:d.tasks, favs:d.favs??state.favs, step:d.step??state.step, dark:d.dark??state.dark, showTL:d.showTL??state.showTL, dayStart:d.dayStart??state.dayStart, dayEnd:d.dayEnd??state.dayEnd };
    }
    case "MERGE_IMPORT": {
      const d = action.data;
      const eN = new Set(state.tasks.map(t=>nameLc(t.name)));
      const newT = (d.tasks||[]).filter(t=>!eN.has(nameLc(t.name)));
      const eF = new Set(state.favs.map(f=>nameLc(f.name)));
      const newF = (d.favs||[]).filter(f=>!eF.has(nameLc(f.name)));
      return { ...state, tasks:[...state.tasks,...newT], favs:[...state.favs,...newF] };
    }
    default: return state;
  }
}

/* ─────────── Day Window Ring (start/end of day) ─────────── */
const RING_SIZE = 240, RING_CX = 120, RING_CY = 120, RING_R = 100, RING_THUMB = 14;

const hourToAngle = h => (h/24)*2*Math.PI - Math.PI/2;
const angleToHourSnapped = a => Math.round((((a+Math.PI/2)/(2*Math.PI)*24)%24+24)%24*2)/2;
function angleDelta(from, to) {
  let d = ((to-from)%(2*Math.PI)+2*Math.PI)%(2*Math.PI);
  if (d>Math.PI) d-=2*Math.PI; return d;
}
function ringArcPath(a1, a2, r) {
  let span = ((a2-a1)%(2*Math.PI)+2*Math.PI)%(2*Math.PI);
  if (span<0.001) span=2*Math.PI;
  const large=span>Math.PI?1:0;
  const x1=RING_CX+r*Math.cos(a1), y1=RING_CY+r*Math.sin(a1);
  const x2=RING_CX+r*Math.cos(a2), y2=RING_CY+r*Math.sin(a2);
  return `M ${x1} ${y1} A ${r} ${r} 0 ${large} 1 ${x2} ${y2}`;
}

function DayWindow({ dayStart, dayEnd, onChange, nowHour }) {
  const svgRef = useRef();
  const dragging = useRef(null);
  const dispS = useRef(null), dispE = useRef(null);
  const tgtS = useRef(hourToAngle(dayStart)), tgtE = useRef(hourToAngle(dayEnd));
  const raf = useRef(null);
  const [, tick] = useReducer(x=>x+1, 0);

  if (dispS.current === null) {
    dispS.current = hourToAngle(dayStart);
    dispE.current = hourToAngle(dayEnd);
  }
  const startAnim = () => {
    if (raf.current) return;
    const run = () => {
      const dS = angleDelta(dispS.current, tgtS.current);
      const dE = angleDelta(dispE.current, tgtE.current);
      dispS.current += dS * LERP_RING;
      dispE.current += dE * LERP_RING;
      if (Math.abs(dS) < TOL_SLIDER && Math.abs(dE) < TOL_SLIDER) {
        dispS.current = tgtS.current; dispE.current = tgtE.current;
        raf.current = null; tick(); return;
      }
      tick(); raf.current = requestAnimationFrame(run);
    };
    raf.current = requestAnimationFrame(run);
  };

  useEffect(() => {
    if (!dragging.current) {
      tgtS.current = hourToAngle(dayStart);
      tgtE.current = hourToAngle(dayEnd);
      startAnim();
    }
  }, [dayStart, dayEnd]);
  useEffect(() => () => { if (raf.current) cancelAnimationFrame(raf.current); }, []);

  const dl = calcDayLen(dayStart, dayEnd);
  const sP = { x: RING_CX + RING_R*Math.cos(dispS.current), y: RING_CY + RING_R*Math.sin(dispS.current) };
  const eP = { x: RING_CX + RING_R*Math.cos(dispE.current), y: RING_CY + RING_R*Math.sin(dispE.current) };

  const getAngle = e => {
    const rect = svgRef.current.getBoundingClientRect();
    const cx = e.clientX, cy = e.clientY;
    return Math.atan2((cy-rect.top)/rect.height*RING_SIZE-RING_CY, (cx-rect.left)/rect.width*RING_SIZE-RING_CX);
  };
  const onDown = which => e => { e.preventDefault(); e.stopPropagation(); dragging.current = which; svgRef.current.setPointerCapture(e.pointerId); };
  const onMove = e => {
    if (!dragging.current) return;
    const rawA = getAngle(e), h = angleToHourSnapped(rawA);
    if (dragging.current === "start") { tgtS.current = rawA; startAnim(); onChange(h, dayEnd); }
    else { tgtE.current = rawA; startAnim(); onChange(dayStart, h); }
  };
  const onUp = () => { dragging.current = null; tgtS.current = hourToAngle(dayStart); tgtE.current = hourToAngle(dayEnd); startAnim(); };

  // Hour ticks
  const ticks = [];
  for (let h = 0; h < 24; h += 3) {
    const a = hourToAngle(h);
    const r1 = RING_R - 6, r2 = RING_R + 6;
    ticks.push({
      x1: RING_CX + r1*Math.cos(a), y1: RING_CY + r1*Math.sin(a),
      x2: RING_CX + r2*Math.cos(a), y2: RING_CY + r2*Math.sin(a),
      h,
    });
  }

  return (
    <svg
      ref={svgRef} width={RING_SIZE} height={RING_SIZE}
      style={{display:"block", touchAction:"none", overflow:"visible"}}
      onPointerMove={onMove} onPointerUp={onUp}
    >
      {/* outer track */}
      <circle cx={RING_CX} cy={RING_CY} r={RING_R} fill="none" stroke="var(--bg-track)" strokeWidth={2}/>
      {/* hour ticks */}
      {ticks.map((t,i)=>(
        <line key={i} x1={t.x1} y1={t.y1} x2={t.x2} y2={t.y2}
          stroke="var(--text-4)" strokeWidth={1} opacity={t.h===0||t.h===12?0.7:0.35}/>
      ))}
      {/* hour labels */}
      {[0,6,12,18].map(h=>{
        const a = hourToAngle(h);
        const r = RING_R + 22;
        const x = RING_CX + r*Math.cos(a), y = RING_CY + r*Math.sin(a);
        return (
          <text key={h} x={x} y={y+4} textAnchor="middle"
            fontFamily="var(--font-mono)" fontSize="10" fill="var(--text-4)" fontWeight="500">
            {String(h).padStart(2,"0")}
          </text>
        );
      })}
      {/* "now" indicator — live current time tick */}
      {typeof nowHour === "number" && (() => {
        const a = hourToAngle(nowHour);
        const r1 = RING_R - 12, r2 = RING_R + 12;
        const x1 = RING_CX + r1*Math.cos(a), y1 = RING_CY + r1*Math.sin(a);
        const x2 = RING_CX + r2*Math.cos(a), y2 = RING_CY + r2*Math.sin(a);
        const dotR = RING_CX + (RING_R + 14)*Math.cos(a);
        const dotY = RING_CY + (RING_R + 14)*Math.sin(a);
        return (
          <g pointerEvents="none">
            <line x1={x1} y1={y1} x2={x2} y2={y2} stroke="var(--accent-3)" strokeWidth={2} strokeLinecap="round"/>
            <circle cx={dotR} cy={dotY} r={3.5} fill="var(--accent-3)">
              <animate attributeName="opacity" values="1;0.45;1" dur="2s" repeatCount="indefinite"/>
            </circle>
          </g>
        );
      })()}
      {/* active arc */}
      <path d={ringArcPath(dispS.current, dispE.current, RING_R)} fill="none"
        stroke="url(#arcGrad)" strokeWidth={4} strokeLinecap="round" opacity={0.9}/>
      <defs>
        <linearGradient id="arcGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stopColor="var(--accent-2)"/>
          <stop offset="100%" stopColor="var(--accent)"/>
        </linearGradient>
      </defs>

      {/* Handles — generous hit areas */}
      <circle cx={sP.x} cy={sP.y} r={26} fill="transparent" style={{cursor:"grab"}} onPointerDown={onDown("start")}/>
      <circle cx={sP.x} cy={sP.y} r={RING_THUMB} fill="var(--bg-elev)" stroke="var(--accent-2)" strokeWidth={3} pointerEvents="none"/>
      <circle cx={sP.x} cy={sP.y} r={4} fill="var(--accent-2)" pointerEvents="none"/>

      <circle cx={eP.x} cy={eP.y} r={26} fill="transparent" style={{cursor:"grab"}} onPointerDown={onDown("end")}/>
      <circle cx={eP.x} cy={eP.y} r={RING_THUMB} fill="var(--bg-elev)" stroke="var(--accent)" strokeWidth={3} pointerEvents="none"/>
      <circle cx={eP.x} cy={eP.y} r={4} fill="var(--accent)" pointerEvents="none"/>
    </svg>
  );
}

/* ─────────── Donut (allocation) ─────────── */
const DONUT_R = 72, DONUT_CX = 120, DONUT_CY = 120, DONUT_INNER = 50;

function buildSegPath(sa, sw) {
  if (sw < 0.001) return "";
  const x1=DONUT_CX+DONUT_R*Math.cos(sa), y1=DONUT_CY+DONUT_R*Math.sin(sa);
  const x2=DONUT_CX+DONUT_R*Math.cos(sa+sw), y2=DONUT_CY+DONUT_R*Math.sin(sa+sw);
  const x3=DONUT_CX+DONUT_INNER*Math.cos(sa+sw), y3=DONUT_CY+DONUT_INNER*Math.sin(sa+sw);
  const x4=DONUT_CX+DONUT_INNER*Math.cos(sa), y4=DONUT_CY+DONUT_INNER*Math.sin(sa);
  const large = sw > Math.PI ? 1 : 0;
  return `M ${x1} ${y1} A ${DONUT_R} ${DONUT_R} 0 ${large} 1 ${x2} ${y2} L ${x3} ${y3} A ${DONUT_INNER} ${DONUT_INNER} 0 ${large} 0 ${x4} ${y4} Z`;
}

function Donut({ tasks, dayLen, dayStart, onSelectTask, selectedId }) {
  const total = tasks.reduce((s,t)=>s+t.hours,0);
  const isOver = total > dayLen + TOL;
  const display = isOver ? tasks.map(t=>({...t, hours: t.hours * (dayLen/total)})) : tasks;
  const remaining = Math.max(0, dayLen - display.reduce((s,t)=>s+t.hours,0));
  const slices = [...display, ...(remaining>TOL?[{id:"free", hours:remaining, color:"var(--bg-track)", isFree:true}]:[])];

  const animA = useRef({}), tgtA = useRef({}), raf = useRef(null);
  const [, rerender] = useReducer(x=>x+1, 0);

  useEffect(() => {
    const targets = {};
    let angle = -Math.PI/2;
    for (const sl of slices) {
      const sw = dayLen > 0 ? (sl.hours/dayLen)*2*Math.PI : 0;
      targets[sl.id] = { startA: angle, sw: Math.max(0, sw) };
      angle += sw;
    }
    tgtA.current = targets;
    for (const id of Object.keys(targets)) {
      if (!animA.current[id]) animA.current[id] = {...targets[id]};
    }
    if (raf.current) return;
    const run = () => {
      const tgt = tgtA.current, cur = animA.current; let more = false; const next = {};
      for (const id of Object.keys(tgt)) {
        const t = tgt[id], c = cur[id] || {...t};
        if (Math.abs(t.startA-c.startA)<TOL_ANGLE && Math.abs(t.sw-c.sw)<TOL_ANGLE) next[id]={...t};
        else { next[id]={startA:c.startA+(t.startA-c.startA)*LERP_DONUT, sw:c.sw+(t.sw-c.sw)*LERP_DONUT}; more=true; }
      }
      animA.current = next; rerender();
      raf.current = more ? requestAnimationFrame(run) : null;
    };
    raf.current = requestAnimationFrame(run);
  }, [tasks, dayLen]);
  useEffect(() => () => { if (raf.current) cancelAnimationFrame(raf.current); }, []);

  const segs = slices.map(sl => {
    const a = animA.current[sl.id] || tgtA.current[sl.id];
    if (!a || a.sw < 0.002) return null;
    return { slice: sl, ...a };
  });

  const selectedTask = selectedId ? tasks.find(t=>t.id===selectedId) : null;
  const selRange = selectedTask ? (() => {
    const idx = tasks.findIndex(t=>t.id===selectedId);
    let c = dayStart; for (let i=0;i<idx;i++) c+=tasks[i].hours||0;
    return { start: c, end: c + selectedTask.hours };
  })() : null;

  // Auto-detect "sleep" task by name (matches "sleep", "alvás", etc.)
  const isSleepName = n => /sleep|alv|rest|nap/i.test(n||"");
  const sleepTask = tasks.find(t => isSleepName(t.name));
  const sleepHours = sleepTask?.hours || 0;
  const workHours = tasks.filter(t => t !== sleepTask).reduce((s,t)=>s+t.hours, 0);

  return (
    <g style={{pointerEvents:"auto"}}>
      {segs.map((seg, i) => {
        if (!seg) return null;
        const { slice } = seg;
        const isFree = slice.isFree;
        const isSel = !isFree && selectedId === slice.id;
        return (
          <path
            key={slice.id || i}
            d={buildSegPath(seg.startA, seg.sw)}
            fill={isFree ? "var(--bg-track)" : slice.color}
            stroke={isSel ? "var(--text)" : "var(--bg-elev)"}
            strokeWidth={isSel ? 2 : 1}
            opacity={isFree ? 0.6 : 1}
            style={{
              cursor: isFree ? "default" : "pointer",
              transition: "stroke-width 0.15s, stroke 0.15s",
              filter: isSel ? `drop-shadow(0 0 8px ${slice.color}aa)` : "none",
            }}
            onClick={isFree ? undefined : () => onSelectTask(slice.id === selectedId ? null : slice.id)}
          />
        );
      })}
      {/* center hole */}
      <circle cx={DONUT_CX} cy={DONUT_CY} r={DONUT_INNER-1} fill="var(--bg-elev)" pointerEvents="none"/>
      {/* center label */}
      {selectedTask ? (
        <g pointerEvents="none">
          <text x={DONUT_CX} y={DONUT_CY-4} textAnchor="middle" fontFamily="var(--font-sans)" fontSize="22" fill={selectedTask.color} fontWeight="600" className="tnum" letterSpacing="-0.02em">
            {formatHours(selectedTask.hours)}
          </text>
          <text x={DONUT_CX} y={DONUT_CY+14} textAnchor="middle" fontFamily="var(--font-sans)" fontSize="11" fill="var(--text-2)" letterSpacing="-0.005em">
            {selectedTask.name.length>16?selectedTask.name.slice(0,16)+"…":selectedTask.name}
          </text>
        </g>
      ) : sleepTask ? (
        <g pointerEvents="none">
          <text x={DONUT_CX} y={DONUT_CY-4} textAnchor="middle" fontFamily="var(--font-sans)" fontSize="22" fill={sleepTask.color} fontWeight="600" className="tnum" letterSpacing="-0.02em">
            {formatHours(sleepHours)} <tspan fontSize="13" fontWeight="500" fill={sleepTask.color} opacity="0.9">sleep</tspan>
          </text>
          <text x={DONUT_CX} y={DONUT_CY+14} textAnchor="middle" fontFamily="var(--font-sans)" fontSize="11" fill="var(--text-3)" letterSpacing="-0.005em">
            {workHours > 0 ? `${formatHours(workHours)} work` : "no work yet"}
          </text>
        </g>
      ) : (
        <g pointerEvents="none">
          <text x={DONUT_CX} y={DONUT_CY-4} textAnchor="middle" fontFamily="var(--font-sans)" fontSize="22" fill={isOver?"var(--danger)":"var(--text)"} fontWeight="600" className="tnum" letterSpacing="-0.02em">
            {formatHours(total)}
          </text>
          <text x={DONUT_CX} y={DONUT_CY+14} textAnchor="middle" fontFamily="var(--font-mono)" fontSize="10" fill={isOver?"var(--danger)":"var(--text-3)"} letterSpacing="0.06em">
            {isOver ? "OVER" : `of ${formatHours(dayLen)}`}
          </text>
        </g>
      )}
    </g>
  );
}

/* ─────────── Linear Slider ─────────── */
function Slider({ value, max, color, step, locked, onChange, ariaLabel }) {
  const trackRef = useRef(), fillRef = useRef(), thumbRef = useRef();
  const dragging = useRef(false), lastSnap = useRef(value);
  const tgtRaw = useRef(value), curRaw = useRef(value), raf = useRef(null);

  const applyPct = p => {
    p = Math.max(0, Math.min(100, p));
    if (fillRef.current) fillRef.current.style.width = p + "%";
    if (thumbRef.current) thumbRef.current.style.left = p + "%";
  };
  const animTo = t => {
    tgtRaw.current = t;
    if (raf.current) return;
    const run = () => {
      const d = tgtRaw.current - curRaw.current;
      if (Math.abs(d) < TOL_SLIDER) { curRaw.current = tgtRaw.current; applyPct(curRaw.current/max*100); raf.current = null; return; }
      curRaw.current += d * LERP;
      applyPct(curRaw.current/max*100);
      raf.current = requestAnimationFrame(run);
    };
    raf.current = requestAnimationFrame(run);
  };

  useEffect(() => { animTo(value); }, [value, max]);
  useEffect(() => () => { if (raf.current) cancelAnimationFrame(raf.current); }, []);

  const getRaw = cx => {
    const r = trackRef.current.getBoundingClientRect();
    return Math.max(0, Math.min(1, (cx-r.left)/r.width)) * max;
  };
  const getSnap = cx => snapToStep(getRaw(cx), step);
  const stepH = step/60;

  const onDown = e => {
    if (locked) return;
    e.preventDefault();
    dragging.current = true;
    trackRef.current.setPointerCapture(e.pointerId);
    trackRef.current.focus();
    const r = getRaw(e.clientX);
    curRaw.current = r; tgtRaw.current = r; applyPct(r/max*100);
    const s = getSnap(e.clientX);
    onChange(s); lastSnap.current = s;
  };
  const onMove = e => {
    if (!dragging.current) return;
    animTo(getRaw(e.clientX));
    const s = getSnap(e.clientX);
    if (s !== lastSnap.current) {
      try { if (navigator.vibrate) navigator.vibrate(3); } catch {}
      lastSnap.current = s;
    }
    onChange(s);
  };
  const onUp = e => {
    if (!dragging.current) return;
    dragging.current = false;
    const s = getSnap(e.clientX);
    onChange(s); animTo(s);
  };
  const onWheel = e => {
    if (locked) return;
    e.preventDefault();
    const dir = e.deltaY > 0 ? -1 : 1;
    const big = e.shiftKey ? 4 : 1;
    const next = Math.max(0, Math.min(max, value + dir * stepH * big));
    onChange(Math.round(next*60/step)*step/60);
  };
  const onKey = e => {
    if (locked) return;
    let delta = 0;
    if (e.key === "ArrowLeft" || e.key === "ArrowDown") delta = -stepH;
    else if (e.key === "ArrowRight" || e.key === "ArrowUp") delta = stepH;
    else if (e.key === "PageDown") delta = -stepH * 4;
    else if (e.key === "PageUp") delta = stepH * 4;
    else if (e.key === "Home") { e.preventDefault(); onChange(0); return; }
    else if (e.key === "End") { e.preventDefault(); onChange(max); return; }
    else return;
    e.preventDefault();
    const next = Math.max(0, Math.min(max, value + delta));
    onChange(Math.round(next*60/step)*step/60);
  };

  const ip = (value/max)*100;
  return (
    <div
      ref={trackRef}
      onPointerDown={onDown} onPointerMove={onMove} onPointerUp={onUp}
      onWheel={onWheel} onKeyDown={onKey}
      tabIndex={locked ? -1 : 0}
      role="slider"
      aria-label={ariaLabel || "Hours"}
      aria-valuemin={0}
      aria-valuemax={max}
      aria-valuenow={value}
      aria-valuetext={formatHours(value)}
      style={{
        position:"relative", height:44, borderRadius:12,
        cursor:locked?"not-allowed":"pointer",
        userSelect:"none", touchAction:locked?"pan-y":"none",
        background:"var(--bg-track)", overflow:"visible",
      }}
    >
      <div style={{position:"absolute", inset:0, borderRadius:12, overflow:"hidden"}}>
        <div ref={fillRef} style={{
          position:"absolute", left:0, top:0, bottom:0, width:`${ip}%`,
          background: `linear-gradient(90deg, ${color}66, ${color})`,
          borderRadius: 12,
        }}/>
      </div>
      {/* thumb */}
      <div ref={thumbRef} style={{
        position:"absolute", left:`${ip}%`, top:"50%",
        transform:"translate(-50%,-50%)",
        width:6, height:32, borderRadius:3,
        background:locked?"var(--text-4)":"#fff",
        boxShadow: locked?"none":`0 2px 8px ${color}99, 0 0 0 1px rgba(0,0,0,0.15)`,
        pointerEvents:"none",
      }}/>
    </div>
  );
}

/* ─────────── Task Card ─────────── */
function TaskCard({ task, taskStart, stepMinutes, dayLen, T_, onChange, onDelete, onEdit, onLock, onFav, isFav, onLongPressStart, onLongPressEnd, isActive, progress }) {
  const taskEnd = taskStart + task.hours;
  const stepH = stepMinutes / 60;
  const nudge = (dir) => {
    if (task.locked) return;
    const next = Math.max(0, Math.min(dayLen, task.hours + dir * stepH));
    onChange({ hours: Math.round(next * 60 / stepMinutes) * stepMinutes / 60 });
  };
  return (
    <div className="card no-select task-row" style={{
      padding:"14px 14px 12px", marginBottom:8,
      transition:"border-color 0.2s, box-shadow 0.2s",
      borderColor: isActive ? task.color : "var(--border)",
      boxShadow: isActive ? `0 0 0 1px ${task.color}55, 0 4px 16px ${task.color}22` : "none",
      position:"relative", overflow:"hidden",
    }}
      onPointerDown={onLongPressStart} onPointerUp={onLongPressEnd} onPointerCancel={onLongPressEnd}
      onContextMenu={e=>e.preventDefault()}>
      {/* progress sliver — shows live progress through the task if active */}
      {isActive && typeof progress === "number" && (
        <div style={{
          position:"absolute", left:0, top:0, bottom:0,
          width: `${Math.max(0, Math.min(100, progress*100))}%`,
          background: `linear-gradient(90deg, ${task.color}10, ${task.color}05)`,
          pointerEvents:"none",
        }}/>
      )}
      <div style={{display:"flex", alignItems:"center", gap:10, marginBottom:10, position:"relative"}}>
        <button onClick={onEdit} aria-label="Edit color" style={{
          width:14, height:14, borderRadius:"50%", background:task.color,
          border:"none", flexShrink:0, padding:0, cursor:"pointer",
          boxShadow:`0 0 0 2px ${task.color}33`,
        }}/>
        <div style={{flex:1, minWidth:0}}>
          <div onClick={onEdit} style={{
            fontSize:15, fontWeight:500, color:"var(--text)",
            letterSpacing:"-0.01em", overflow:"hidden", textOverflow:"ellipsis",
            whiteSpace:"nowrap", cursor:"pointer", marginBottom:2,
            display:"flex", alignItems:"center", gap:8,
          }}>
            <span style={{overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap"}}>{task.name}</span>
            {isActive && (
              <span style={{
                display:"inline-flex", alignItems:"center", gap:4,
                padding:"2px 7px", borderRadius:999,
                background:`${task.color}22`, color:task.color,
                fontFamily:"var(--font-mono)", fontSize:9, fontWeight:600,
                letterSpacing:"0.08em", flexShrink:0,
              }}>
                <span style={{width:5, height:5, borderRadius:"50%", background:task.color, animation:"pulse 1.6s ease-in-out infinite"}}/>
                NOW
              </span>
            )}
          </div>
          <div style={{display:"flex", gap:8, alignItems:"center", fontFamily:"var(--font-mono)", fontSize:11, color:"var(--text-3)"}}>
            <span className="tnum">{formatTime(taskStart)}</span>
            <span style={{opacity:0.4}}>→</span>
            <span className="tnum">{formatTime(taskEnd)}</span>
            <span style={{opacity:0.4, margin:"0 4px"}}>·</span>
            <span className="tnum" style={{color:task.color, fontWeight:500}}>{formatHours(task.hours)}</span>
          </div>
        </div>
        <div style={{display:"flex", gap:2, flexShrink:0}} onPointerDown={e=>e.stopPropagation()}>
          {/* Nudge buttons — keyboard/mouse-friendly fine adjust */}
          {!task.locked && (
            <div className="row-nudge" style={{display:"flex", gap:1, marginRight:4}}>
              <button onClick={()=>nudge(-1)} aria-label={`Decrease ${task.name}`} className="btn btn-ghost btn-icon" style={{
                width:30, minHeight:30, borderRadius:8, border:"1px solid var(--border)",
                color:"var(--text-3)", padding:0,
              }}>
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><line x1="5" y1="12" x2="19" y2="12"/></svg>
              </button>
              <button onClick={()=>nudge(1)} aria-label={`Increase ${task.name}`} className="btn btn-ghost btn-icon" style={{
                width:30, minHeight:30, borderRadius:8, border:"1px solid var(--border)",
                color:"var(--text-3)", padding:0,
              }}>
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              </button>
            </div>
          )}
          <button onClick={onFav} aria-label={isFav?"Remove favourite":"Save favourite"} className="btn btn-ghost btn-icon" style={{
            width:36, minHeight:36, borderRadius:8, border:"none",
            color: isFav?"var(--accent-3)":"var(--text-4)",
          }}>
            <svg width="16" height="16" viewBox="0 0 24 24" fill={isFav?"currentColor":"none"} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          </button>
          <button onClick={onLock} aria-label={task.locked?"Unlock":"Lock"} className="btn btn-ghost btn-icon" style={{
            width:36, minHeight:36, borderRadius:8, border:"none",
            color: task.locked?"var(--accent-2)":"var(--text-4)",
          }}>
            {task.locked
              ? <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              : <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/></svg>
            }
          </button>
          {!task.locked && (
            <button onClick={onDelete} aria-label="Delete" className="btn btn-ghost btn-icon" style={{
              width:36, minHeight:36, borderRadius:8, border:"none",
              color: "var(--text-4)",
            }} onMouseEnter={e=>e.currentTarget.style.color="var(--danger)"} onMouseLeave={e=>e.currentTarget.style.color="var(--text-4)"}>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
          )}
        </div>
      </div>
      <div onPointerDown={e=>e.stopPropagation()}>
        <Slider value={task.hours} max={dayLen} step={stepMinutes} color={task.color} locked={task.locked}
          ariaLabel={`${task.name} hours`}
          onChange={h=>onChange({hours:h})}/>
      </div>
    </div>
  );
}

/* ─────────── Sync Modal ─────────── */
function SyncModal({ state, onImport, onClose }) {
  const [mode, setMode] = useState("export");
  const [importStr, setImportStr] = useState("");
  const [importMode, setImportMode] = useState("full");
  const [copied, setCopied] = useState(false);
  const [err, setErr] = useState(null);
  const [preview, setPreview] = useState(null);
  const syncStr = encodeSync(state);

  const handleCopy = () => {
    if (!syncStr) return;
    navigator.clipboard?.writeText(syncStr).then(()=>setCopied(true));
    setTimeout(()=>setCopied(false), 2000);
  };
  const handleImport = (val) => {
    setImportStr(val); setErr(null); setPreview(null);
    if (!val.trim()) return;
    const d = decodeSync(val);
    if (!d) { setErr("Invalid code — make sure it's complete."); return; }
    setPreview(d);
  };

  return (
    <div className="modal-overlay" onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
      <div className="modal-sheet" style={{padding:"24px 0 24px"}}>
        <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", padding:"0 24px", marginBottom:18}}>
          <h2 style={{fontSize:20, fontWeight:600, letterSpacing:"-0.02em"}}>Sync &amp; backup</h2>
          <button onClick={onClose} className="btn btn-ghost btn-icon" aria-label="Close">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>

        <div className="tab-bar" style={{borderBottom:"1px solid var(--border)", padding:"0 20px", marginBottom:20}}>
          <button className={`tab ${mode==="export"?"active":""}`} onClick={()=>setMode("export")}>Export</button>
          <button className={`tab ${mode==="import"?"active":""}`} onClick={()=>setMode("import")}>Import</button>
        </div>

        <div style={{padding:"0 24px"}}>
          {mode==="export" ? (
            <div>
              <p style={{fontSize:13, color:"var(--text-3)", lineHeight:1.6, marginBottom:14}}>
                Copy this code to back up or restore everything (tasks, favourites, settings) on another device.
              </p>
              <textarea readOnly value={syncStr||""} className="input"
                style={{height:96, padding:12, fontFamily:"var(--font-mono)", fontSize:11, lineHeight:1.5, marginBottom:12, resize:"none"}}/>
              <button onClick={handleCopy} className="btn btn-primary" style={{width:"100%", minHeight:52}}>
                {copied ? "Copied" : "Copy code"}
              </button>
            </div>
          ) : (
            <div>
              <p style={{fontSize:13, color:"var(--text-3)", lineHeight:1.6, marginBottom:14}}>
                Paste your code, then choose how to import.
              </p>
              <textarea value={importStr} onChange={e=>handleImport(e.target.value)}
                placeholder="Paste code here…" className="input"
                style={{height:96, padding:12, fontFamily:"var(--font-mono)", fontSize:11, lineHeight:1.5, marginBottom:8, resize:"none",
                        borderColor: err?"var(--danger)":preview?"var(--accent-2)":"var(--border)"}}/>
              {err && <div style={{fontSize:12, color:"var(--danger)", marginBottom:12}}>{err}</div>}
              {preview && (
                <div className="card" style={{padding:"10px 12px", marginBottom:14, fontSize:12, color:"var(--text-3)"}}>
                  <span style={{color:"var(--accent-2)"}}>✓ Valid </span>·{" "}
                  {preview.tasks?.length ?? 0} tasks, {preview.favs?.length ?? 0} favourites
                </div>
              )}
              <div className="label" style={{marginBottom:8}}>Mode</div>
              <div style={{display:"flex", flexDirection:"column", gap:6, marginBottom:18}}>
                {[["full","Replace all","Overwrites existing data"],
                  ["merge","Merge new only","Adds only what's missing"]].map(([v,t,d])=>(
                  <button key={v} onClick={()=>setImportMode(v)}
                    style={{
                      background: importMode===v?"var(--bg-elev-2)":"transparent",
                      border:`1px solid ${importMode===v?"var(--accent)":"var(--border)"}`,
                      borderRadius:10, padding:"12px 14px", textAlign:"left", cursor:"pointer",
                      transition:"all 0.15s",
                    }}>
                    <div style={{fontSize:14, fontWeight:500, color:importMode===v?"var(--accent)":"var(--text)"}}>{t}</div>
                    <div style={{fontSize:12, color:"var(--text-3)", marginTop:2}}>{d}</div>
                  </button>
                ))}
              </div>
              <button onClick={()=>{ if(preview) { onImport(preview, importMode); onClose(); } }}
                className="btn btn-primary" disabled={!preview}
                style={{width:"100%", minHeight:52, opacity:preview?1:0.4, cursor:preview?"pointer":"not-allowed"}}>
                Import
              </button>
            </div>
          )}
        </div>
        <div style={{height:"env(safe-area-inset-bottom,0px)"}}/>
      </div>
    </div>
  );
}

/* ─────────── Timeline strip ─────────── */
function Timeline({ tasks, dayLen, dayStart }) {
  let cursor = 0;
  const segs = tasks.filter(t=>t.hours>0.02).map(t => { const s=cursor; cursor+=t.hours; return {...t, start:s}; });
  const ticks = [0, .25, .5, .75, 1].map(f => Math.round((dayStart+f*dayLen)*2)/2);
  return (
    <div className="card" style={{padding:"14px", marginBottom:16}}>
      <div style={{position:"relative", height:32, borderRadius:8, overflow:"hidden", background:"var(--bg-track)", marginBottom:8, display:"flex"}}>
        {segs.map(s => {
          const w = (s.hours/dayLen)*100;
          return (
            <div key={s.id} title={`${s.name} · ${formatHours(s.hours)}`} style={{
              width:`${w}%`, height:"100%", background:s.color,
              display:"flex", alignItems:"center", justifyContent:"flex-start", overflow:"hidden",
              borderRight:"1px solid var(--bg-elev)",
            }}>
              {w>10 && <span style={{fontSize:11, color:"rgba(0,0,0,0.7)", fontWeight:600, padding:"0 8px", whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis"}}>{s.name}</span>}
            </div>
          );
        })}
      </div>
      <div style={{display:"flex", justifyContent:"space-between", fontFamily:"var(--font-mono)", fontSize:10, color:"var(--text-4)"}}>
        {ticks.map((h,i)=>(
          <span key={i} className="tnum">{String(Math.floor(h)).padStart(2,"0")}:{h%1?"30":"00"}</span>
        ))}
      </div>
    </div>
  );
}

/* ─────────── Week / Month ─────────── */
function WeekTaskRow({ task, step, onHoursChange, onDelete }) {
  return (
    <div style={{marginBottom:8}}>
      <div style={{display:"flex", alignItems:"center", gap:8, marginBottom:5}}>
        <div style={{width:8, height:8, borderRadius:"50%", background:task.color, flexShrink:0}}/>

        <span style={{fontFamily:"var(--font-mono)", fontSize:11, color:task.color, fontWeight:500, flexShrink:0}} className="tnum">{formatHours(task.hours)}</span>
        <button onClick={onDelete} aria-label="Delete" className="btn btn-ghost btn-icon" style={{width:30, minHeight:30, color:"var(--text-4)"}}>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <Slider value={task.hours} max={Math.max(task.hours, 12)} step={step} color={task.color} locked={false} onChange={onHoursChange}/>
    </div>
  );
}

function DayCard({ dayData, dayIdx, step, todayTasks, isToday, onUpdate }) {
  const [expanded, setExpanded] = useState(false);
  const [newName, setNewName] = useState("");
  const total = weekTotalHours(dayData);
  const taskCount = dayData.tasks.length;
  const hasNote = dayData.note && dayData.note.trim().length > 0;

  const copyFromToday = () => {
    if (!todayTasks.length) return;
    const copied = todayTasks.map(t => ({...t, id: Date.now() + Math.random(), done: false}));
    onUpdate({ tasks: copied });
  };
  const addTask = () => {
    const name = newName.trim(); if (!name) return;
    const color = PALETTE[dayData.tasks.length % PALETTE.length];
    onUpdate({ tasks: [...dayData.tasks, { id: Date.now()+Math.random(), name, hours:1, originalHours:1, color, locked:false, actual:0 }] });
    setNewName("");
  };
  const updateTaskHours = (id, hours) => onUpdate({ tasks: dayData.tasks.map(t => t.id===id ? {...t, hours, originalHours:hours} : t) });
  const deleteTask = id => onUpdate({ tasks: dayData.tasks.filter(t=>t.id!==id) });

  const segments = dayData.tasks.filter(t=>t.hours>0);
  const segTotal = segments.reduce((s,t)=>s+t.hours,0);

  return (
    <div className="card" style={{
      borderColor: isToday ? "var(--accent)" : "var(--border)",
      overflow:"hidden", transition:"border-color 0.2s",
    }}>
      <button onClick={()=>setExpanded(v=>!v)} style={{
        width:"100%", background:"transparent", border:"none", padding:"14px 16px",
        display:"flex", alignItems:"center", gap:14, cursor:"pointer", textAlign:"left",
        minHeight: 60,
      }}>
        <div style={{flexShrink:0, width:80}}>
          <div style={{fontSize:14, fontWeight:600, color: isToday?"var(--accent)":"var(--text)", letterSpacing:"-0.01em"}}>
            {DAYS[dayIdx]}
          </div>
          {isToday && <div style={{fontSize:10, color:"var(--accent)", fontFamily:"var(--font-mono)", letterSpacing:"0.08em", marginTop:2}}>TODAY</div>}
        </div>
        <div style={{flex:1, height:6, borderRadius:3, background:"var(--bg-track)", overflow:"hidden", position:"relative"}}>
          {segTotal>0 && segments.map((t,i)=>{
            const left = segments.slice(0,i).reduce((s,x)=>s+x.hours,0)/segTotal*100;
            const w = t.hours/segTotal*100;
            return <div key={t.id} style={{position:"absolute", left:`${left}%`, width:`${w}%`, top:0, bottom:0, background:t.color}}/>;
          })}
        </div>
        <div style={{flexShrink:0, textAlign:"right", minWidth:60}}>
          {total>0
            ? <div className="tnum" style={{fontSize:13, fontWeight:600, color:"var(--accent)"}}>{formatHours(total)}</div>
            : <div style={{fontSize:13, color:"var(--text-4)"}}>—</div>}
          {taskCount>0 && <div style={{fontSize:10, color:"var(--text-3)", fontFamily:"var(--font-mono)"}}>{taskCount} task{taskCount>1?"s":""}</div>}
        </div>
        {hasNote && <div style={{flexShrink:0, color:"var(--text-3)"}}>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
        </div>}
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"
          style={{color:"var(--text-3)", flexShrink:0, transform:expanded?"rotate(180deg)":"none", transition:"transform 0.2s"}}>
          <polyline points="6 9 12 15 18 9"/>
        </svg>
      </button>

      {expanded && (
        <div style={{borderTop:"1px solid var(--border)", padding:"14px 16px", animation:"fadeUp 0.18s"}}>
          {dayData.tasks.length>0 && (
            <div style={{marginBottom:12}}>
              {dayData.tasks.map(t => (
                <WeekTaskRow key={t.id} task={t} step={step}
                  onHoursChange={h=>updateTaskHours(t.id, h)}
                  onDelete={()=>deleteTask(t.id)}/>
              ))}
            </div>
          )}
          <div style={{display:"flex", gap:8, marginBottom:10}}>
            <input value={newName} onChange={e=>setNewName(e.target.value)}
              onKeyDown={e=>e.key==="Enter"&&addTask()}
              placeholder="Add a task…" className="input" style={{minHeight:42, fontSize:14}}/>
            <button onClick={addTask} className="btn btn-primary" style={{minHeight:42, padding:"0 18px"}}>Add</button>
          </div>
          <div style={{display:"flex", gap:6, flexWrap:"wrap", marginBottom:10}}>
            {todayTasks.length>0 && (
              <button onClick={copyFromToday} className="btn" style={{minHeight:36, padding:"0 12px", fontSize:12}}>Copy from today</button>
            )}
            {dayData.tasks.length>0 && (
              <button onClick={()=>onUpdate({tasks:[]})} className="btn btn-danger" style={{minHeight:36, padding:"0 12px", fontSize:12}}>Clear all</button>
            )}
          </div>
          <textarea value={dayData.note||""} onChange={e=>onUpdate({note:e.target.value})}
            placeholder="Note for the day…" rows={2} className="input"
            style={{padding:"10px 14px", fontSize:13, lineHeight:1.5, resize:"none", minHeight:60}}/>
        </div>
      )}
    </div>
  );
}

function MonthView({ onDateSelect, activeDate }) {
  const now = new Date();
  const [viewYear, setViewYear] = useState(now.getFullYear());
  const [viewMonth, setViewMonth] = useState(now.getMonth());
  const today = todayStr();
  const monthNames = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  const prevMonth = () => { if (viewMonth===0) { setViewYear(y=>y-1); setViewMonth(11); } else setViewMonth(m=>m-1); };
  const nextMonth = () => { if (viewMonth===11) { setViewYear(y=>y+1); setViewMonth(0); } else setViewMonth(m=>m+1); };

  const firstDay = new Date(viewYear, viewMonth, 1);
  const daysInMonth = new Date(viewYear, viewMonth+1, 0).getDate();
  let startDow = firstDay.getDay()-1; if (startDow<0) startDow=6;
  const cells = [];
  for (let i=0;i<startDow;i++) cells.push(null);
  for (let d=1;d<=daysInMonth;d++) cells.push(d);
  while (cells.length%7!==0) cells.push(null);

  const getDs = day => `${viewYear}-${String(viewMonth+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
  const datesWithTasks = getDatesWithTasks();

  return (
    <div style={{padding:"16px"}}>
      <div style={{display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:16}}>
        <button onClick={prevMonth} className="btn btn-ghost btn-icon" aria-label="Previous month">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <div style={{fontSize:18, fontWeight:600, letterSpacing:"-0.02em"}}>{monthNames[viewMonth]} {viewYear}</div>
        <button onClick={nextMonth} className="btn btn-ghost btn-icon" aria-label="Next month">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
      </div>
      <div style={{display:"grid", gridTemplateColumns:"repeat(7,1fr)", gap:4, marginBottom:6}}>
        {["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map((h,i)=>(
          <div key={i} style={{textAlign:"center", fontFamily:"var(--font-mono)", fontSize:10, color:"var(--text-4)", letterSpacing:"0.04em", padding:"4px 0"}}>{h}</div>
        ))}
      </div>
      <div style={{display:"grid", gridTemplateColumns:"repeat(7,1fr)", gap:4}}>
        {cells.map((day, idx) => {
          if (!day) return <div key={`e-${idx}`} style={{minHeight:54}}/>;
          const ds = getDs(day);
          const dayTasks = datesWithTasks[ds] || [];
          const isToday = ds === today;
          const isActive = ds === activeDate;
          const hasTasks = dayTasks.length > 0;
          const isPast = ds < today;
          return (
            <button key={ds} onClick={()=>onDateSelect(ds)} style={{
              background: isActive?"color-mix(in oklab, var(--accent) 25%, transparent)":isToday?"color-mix(in oklab, var(--accent) 12%, transparent)":hasTasks?"var(--bg-elev-2)":"transparent",
              border:`1px solid ${isActive?"var(--accent)":isToday?"color-mix(in oklab, var(--accent) 50%, transparent)":hasTasks?"var(--border)":"transparent"}`,
              borderRadius:10, padding:"6px 4px", cursor:"pointer",
              display:"flex", flexDirection:"column", alignItems:"center", gap:4,
              minHeight:54, transition:"all 0.15s",
              opacity:isPast&&!hasTasks&&!isToday?0.4:1,
            }}>
              <span className="tnum" style={{fontSize:13, color:isActive||isToday?"var(--accent)":hasTasks?"var(--text)":"var(--text-3)", fontWeight:isActive||isToday?600:400}}>{day}</span>
              <div style={{display:"flex", gap:2, justifyContent:"center", minHeight:8, flexWrap:"wrap"}}>
                {dayTasks.slice(0,4).map((t,i)=><div key={i} style={{width:5, height:5, borderRadius:"50%", background:t.color}}/>)}
                {dayTasks.length>4 && <span style={{fontSize:8, color:"var(--text-4)", fontFamily:"var(--font-mono)", lineHeight:"6px"}}>+{dayTasks.length-4}</span>}
              </div>
            </button>
          );
        })}
      </div>
    </div>
  );
}

function WeekView({ step, todayTasks, onDateSelect, activeDate }) {
  const [week, setWeek] = useState(loadWeek);
  const [view, setView] = useState("week");
  useEffect(() => { saveJSON(WEEK_KEY, week); }, [week]);
  const updateDay = (idx, patch) => setWeek(prev => prev.map((d,i)=>i===idx?{...d,...patch}:d));

  const todayDowRaw = new Date().getDay();
  const todayDow = todayDowRaw===0 ? 6 : todayDowRaw-1;
  const weekTotal = week.reduce((s,d)=>s+weekTotalHours(d),0);
  const filledDays = week.filter(d=>d.tasks.length>0).length;

  return (
    <div>
      <div className="tab-bar" style={{borderBottom:"1px solid var(--border)", padding:"0 16px"}}>
        <button className={`tab ${view==="week"?"active":""}`} onClick={()=>setView("week")}>Week</button>
        <button className={`tab ${view==="month"?"active":""}`} onClick={()=>setView("month")}>Month</button>
      </div>

      {view==="month" ? (
        <MonthView onDateSelect={onDateSelect} activeDate={activeDate}/>
      ) : (
        <div style={{padding:"16px"}}>
          <div className="card" style={{padding:"14px 16px", marginBottom:14, display:"flex", alignItems:"center", gap:14}}>
            <div>
              <div className="tnum" style={{fontSize:22, fontWeight:600, color:"var(--accent)", letterSpacing:"-0.02em", lineHeight:1}}>{formatHours(weekTotal)}</div>
              <div style={{fontSize:10, color:"var(--text-3)", fontFamily:"var(--font-mono)", letterSpacing:"0.06em", marginTop:3}}>WEEK</div>
            </div>
            <div style={{flex:1, height:8, borderRadius:4, background:"var(--bg-track)", overflow:"hidden", display:"flex"}}>
              {week.map((d,i)=>{
                const w = weekTotal>0 ? (weekTotalHours(d)/weekTotal*100) : (100/7);
                const col = d.tasks[0]?.color || "var(--bg-track)";
                return <div key={i} style={{width:`${w}%`, height:"100%", background:weekTotalHours(d)>0?col:"var(--bg-track)", borderRight:i<6?"1px solid var(--bg-elev)":"none", opacity:weekTotalHours(d)>0?1:0.3}}/>;
              })}
            </div>
            <div style={{textAlign:"right"}}>
              <div className="tnum" style={{fontSize:14, fontWeight:600}}>{filledDays}<span style={{color:"var(--text-4)", fontWeight:400}}>/7</span></div>
              <div style={{fontSize:10, color:"var(--text-3)", fontFamily:"var(--font-mono)", letterSpacing:"0.06em"}}>DAYS</div>
            </div>
          </div>
          <div style={{display:"flex", flexDirection:"column", gap:8}}>
            {week.map((dayData, idx) => (
              <DayCard key={idx} dayData={dayData} dayIdx={idx} step={step}
                todayTasks={todayTasks} isToday={idx===todayDow}
                onUpdate={patch=>updateDay(idx, patch)}/>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

/* ─────────── Auth + Sync hooks ─────────── */
function useAuth() {
  const [user, setUser] = useState(() => {
    const u = fbAuth.currentUser;
    return u ? { uid: u.uid, email: u.email, displayName: u.displayName, photoURL: u.photoURL } : null;
  });
  useEffect(() => {
    const h = (e) => setUser(e.detail);
    window.addEventListener(AUTH_EVENT, h);
    return () => window.removeEventListener(AUTH_EVENT, h);
  }, []);
  return user;
}
function useSyncStatus() {
  const [status, setStatus] = useState(getSyncStatus());
  useEffect(() => {
    const h = (e) => setStatus(e.detail);
    window.addEventListener(STATUS_EVENT, h);
    return () => window.removeEventListener(STATUS_EVENT, h);
  }, []);
  return status;
}
// Forces a re-render when remote data is pulled into localStorage.
function useRemoteUpdates(cb) {
  useEffect(() => {
    const h = (e) => cb && cb(e.detail);
    window.addEventListener(SYNC_EVENT, h);
    return () => window.removeEventListener(SYNC_EVENT, h);
  }, [cb]);
}

function HeaderSyncDot() {
  const user = useAuth();
  const status = useSyncStatus();
  if (!user) return null;
  const colors = { synced: "var(--success)", pending: "var(--accent-3)", offline: "var(--text-3)", error: "var(--danger)" };
  const c = colors[status] || "var(--text-3)";
  const titles = { synced: "All changes synced", pending: "Syncing…", offline: "Offline — will sync when back online", error: "Sync error" };
  return (
    <span title={titles[status] || ""} style={{
      display:"inline-block", width:6, height:6, borderRadius:"50%", background:c,
      marginLeft:2, animation: status==="pending"?"pulse 1.2s infinite":"none",
    }}/>
  );
}

function SyncBadge() {
  const status = useSyncStatus();
  const user = useAuth();
  if (!user) return null;
  const colors = { synced: "var(--success)", pending: "var(--accent-3)", offline: "var(--text-3)", error: "var(--danger)" };
  const labels = { synced: "Synced", pending: "Syncing…", offline: "Offline", error: "Sync error" };
  const c = colors[status] || "var(--text-3)";
  return (
    <div title={labels[status] || status} style={{
      display:"inline-flex", alignItems:"center", gap:6,

      background:"var(--bg-elev)", borderRadius:99, border:"1px solid var(--border)",

        animation: status==="pending"?"pulse 1.2s infinite":"none",

}
